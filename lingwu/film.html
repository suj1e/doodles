<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灵物 — 胶片记忆</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: #1a120a;
    font-family: "Courier New", "Menlo", monospace;
    color: #d4b896;
  }
  body { display: flex; flex-direction: column; align-items: center; }

  .screen {
    width: 375px;
    min-height: 667px;
    position: relative;
    overflow: hidden;
    background: #2b1d12;
    border: 1px solid #3d2a18;
    margin-bottom: 24px;
  }
  /* 暗角 + 颗粒感 */
  .screen::before {
    content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.5) 100%);
  }
  .screen::after {
    content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,220,150,0.02) 0px, transparent 1px, transparent 2px, rgba(0,0,0,0.03) 3px);
    opacity: 0.7;
  }
  .screen-content { position: relative; z-index: 3; width: 100%; height: 100%; }
  .screen-label {
    position: absolute; top: -18px; left: 0;
    font-size: 10px; color: #5a4226;
    letter-spacing: 0.1em;
  }
  .pages-wrap { display: flex; flex-direction: column; gap: 48px; padding: 48px 0; }

  /* ============ ① 相机 ============ */
  .camera {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .camera-close {
    position: absolute; top: 24px; left: 24px;
    color: #5a4226; font-size: 20px; z-index: 4;
  }
  .camera-frame {
    width: 220px; height: 220px;
    border: 2px solid #6a4e30;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    filter: sepia(0.3);
  }
  .camera-frame::before {
    content: "REC ●"; position: absolute; top: 8px; left: 10px;
    font-size: 9px; color: #c4542a; letter-spacing: 0.2em;
    animation: blink 2s infinite;
  }
  @keyframes blink { 50% { opacity: 0.3; } }
  .camera-frame::after {
    content: "00:03:24"; position: absolute; bottom: 8px; right: 10px;
    font-size: 9px; color: #8a6a42; letter-spacing: 0.1em;
  }
  .viewfinder-obj { font-size: 60px; opacity: 0.7; }
  .camera-hint {
    margin-top: 48px;
    text-align: center;
    color: #8a6a42;
    font-size: 13px;
    line-height: 2.4;
    letter-spacing: 0.15em;
  }
  .shutter {
    position: absolute; bottom: 56px; left: 50%; transform: translateX(-50%);
    width: 60px; height: 60px; border-radius: 50%;
    border: 2px solid #8a6a42; z-index: 4;
    display: flex; align-items: center; justify-content: center;
  }
  .shutter::after {
    content: ""; width: 46px; height: 46px; border-radius: 50%;
    background: #6a4e30;
  }

  /* ============ ② 苏醒 ============ */
  .awaken {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .awaken-flicker {
    font-size: 28px; color: #d4b896;
    animation: flicker 0.15s infinite alternate;
    letter-spacing: 0.2em;
  }
  @keyframes flicker {
    0% { opacity: 0.7; text-shadow: 0 0 4px rgba(212,184,150,0.4); }
    100% { opacity: 1; text-shadow: 0 0 12px rgba(212,184,150,0.7); }
  }
  .awaken-text {
    margin-top: 36px;
    color: #6a4e30;
    font-size: 12px;
    letter-spacing: 0.4em;
  }
  .awaken-bar {
    margin-top: 32px;
    width: 120px; height: 2px;
    background: #3d2a18; overflow: hidden;
  }
  .awaken-bar::after {
    content: ""; display: block; width: 40%; height: 100%;
    background: #c4842a;
    animation: load 2s ease-in-out infinite;
  }
  @keyframes load {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }

  /* ============ ③ 揭晓 ============ */
  .reveal {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 48px 32px;
  }
  .reveal-card {
    width: 100%; max-width: 280px;
    text-align: center;
    animation: filmReveal 1.4s cubic-bezier(0.16,1,0.3,1);
  }
  @keyframes filmReveal {
    from { opacity: 0; transform: scale(1.05); filter: sepia(1) blur(3px); }
    to { opacity: 1; transform: scale(1); filter: sepia(0.2) blur(0); }
  }
  .reveal-photo-wrap {
    position: relative; width: 160px; margin: 0 auto;
  }
  .reveal-photo {
    width: 160px; height: 160px;
    background: linear-gradient(135deg, #4a3422, #6a4e30);
    border: 3px solid #1a120a;
    display: flex; align-items: center; justify-content: center;
    font-size: 60px;
    filter: sepia(0.4) contrast(1.1);
  }
  .reveal-photo-wrap::before {
    content: "NO. 0001";
    position: absolute; top: -20px; left: 0;
    font-size: 9px; color: #8a6a42; letter-spacing: 0.2em;
  }
  .reveal-photo-wrap::after {
    content: "07 . 08 . 26";
    position: absolute; bottom: -20px; right: 0;
    font-size: 9px; color: #8a6a42; letter-spacing: 0.1em;
  }
  .reveal-name {
    font-size: 32px;
    color: #e8c89a;
    margin-top: 44px;
    letter-spacing: 0.1em;
  }
  .reveal-era {
    font-size: 11px;
    color: #8a6a42;
    margin-top: 12px;
    letter-spacing: 0.3em;
  }
  .reveal-line {
    font-size: 16px;
    color: #c4a878;
    line-height: 2.2;
    margin-top: 36px;
    letter-spacing: 0.05em;
    position: relative;
  }
  .reveal-line::before { content: "› "; color: #6a4e30; }
  .reveal-cta {
    margin-top: 56px;
    padding: 10px 28px;
    border: 1px solid #6a4e30;
    color: #d4b896;
    font-size: 13px;
    letter-spacing: 0.25em;
    display: inline-block;
    background: rgba(106,78,48,0.1);
  }

  /* ============ ④ 聊天 ============ */
  .chat { display: flex; flex-direction: column; }
  .chat-header {
    padding: 16px 20px;
    border-bottom: 1px solid #3d2a18;
    display: flex; align-items: center; gap: 12px;
  }
  .chat-avatar {
    width: 30px; height: 30px;
    background: #4a3422; border: 1px solid #6a4e30;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; filter: sepia(0.3);
  }
  .chat-name { font-size: 15px; color: #d4b896; letter-spacing: 0.1em; }
  .chat-meta { font-size: 9px; color: #5a4226; margin-left: auto; letter-spacing: 0.1em; }
  .chat-back { color: #5a4226; }
  .chat-body { flex: 1; padding: 24px 18px; display: flex; flex-direction: column; gap: 16px; }
  .bubble {
    max-width: 76%;
    padding: 10px 14px;
    font-size: 14px; line-height: 1.9;
    letter-spacing: 0.03em;
  }
  .bubble-spirit {
    align-self: flex-start;
    background: #3a2818;
    border: 1px solid #4a3422;
    color: #c4a878;
    border-radius: 2px 12px 12px 12px;
  }
  .bubble-spirit::before {
    content: "› "; color: #8a6a42;
  }
  .bubble-user {
    align-self: flex-end;
    background: #5a3820;
    color: #e8c89a;
    border-radius: 12px 2px 12px 12px;
  }
  .typing { display: inline-flex; gap: 4px; align-items: center; }
  .typing span {
    width: 5px; height: 5px; border-radius: 50%;
    background: #6a4e30;
    animation: filmTyping 1.4s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes filmTyping {
    0%,60%,100% { opacity: 0.3; }
    30% { opacity: 1; }
  }
  .chat-input {
    padding: 12px 20px 32px;
    border-top: 1px solid #3d2a18;
    display: flex; align-items: center; gap: 12px;
  }
  .chat-input-field {
    flex: 1; height: 34px;
    background: #1a120a; border: 1px solid #3d2a18;
    padding: 0 14px;
    color: #6a4e30; font-size: 13px;
    font-family: "Courier New", monospace;
    display: flex; align-items: center;
  }
  .chat-input-field::after {
    content: "_"; animation: cursor 1s infinite; color: #8a6a42;
  }
  @keyframes cursor { 50% { opacity: 0; } }
  .chat-send {
    color: #8a6a42; font-size: 13px; letter-spacing: 0.15em;
  }
</style>
</head>
<body>

<div class="pages-wrap">

  <!-- ① 相机 -->
  <div class="screen camera">
    <span class="screen-label">① 相机</span>
    <div class="screen-content" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;">
      <div class="camera-close">✕</div>
      <div class="camera-frame">
        <span class="viewfinder-obj">☕</span>
      </div>
      <div class="camera-hint">
        SCAN AN OBJECT<br>
        <span style="color:#5a4226">或许它记得一些事</span>
      </div>
      <div class="shutter"></div>
    </div>
  </div>

  <!-- ② 苏醒 -->
  <div class="screen awaken">
    <span class="screen-label">② 苏醒</span>
    <div class="screen-content" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;">
      <div class="awaken-flicker">[ R E C O V E R I N G ]</div>
      <div class="awaken-text">信号微弱 · 正在重建</div>
      <div class="awaken-bar"></div>
    </div>
  </div>

  <!-- ③ 揭晓 -->
  <div class="screen reveal">
    <span class="screen-label">③ 揭晓</span>
    <div class="screen-content" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;">
      <div class="reveal-card">
        <div class="reveal-photo-wrap">
          <div class="reveal-photo">☕</div>
        </div>
        <div class="reveal-name">老 白</div>
        <div class="reveal-era">FILE_03 · 第三纪元</div>
        <div class="reveal-line">
          光。好久没有光了。<br>
          你是第几个看我的人？
        </div>
        <div class="reveal-cta">> 开 始 对 话</div>
      </div>
    </div>
  </div>

  <!-- ④ 聊天 -->
  <div class="screen chat">
    <span class="screen-label">④ 聊天</span>
    <div class="screen-content" style="display:flex;flex-direction:column;height:100%;">
      <div class="chat-header">
        <span class="chat-back">‹</span>
        <div class="chat-avatar">☕</div>
        <div class="chat-name">老白</div>
        <div class="chat-meta">REC ●</div>
      </div>
      <div class="chat-body">
        <div class="bubble bubble-spirit">光。好久没有光了。你是第几个看我的人？</div>
        <div class="bubble bubble-user">你是谁？</div>
        <div class="bubble bubble-spirit">我记得一种颜色，你们的语言里没有它的名字。我曾是它的一部分。</div>
        <div class="bubble bubble-user">你在这多久了？</div>
        <div class="bubble bubble-spirit">
          <div class="typing"><span></span><span></span><span></span></div>
        </div>
      </div>
      <div class="chat-input">
        <div class="chat-input-field">type here</div>
        <div class="chat-send">SEND</div>
      </div>
    </div>
  </div>

</div>

</body>
</html>
