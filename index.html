<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>doodles — 原型草稿</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    background: #0a0a0c;
    color: #e8e8e8;
    min-height: 100vh;
    padding: 56px 20px 80px;
  }

  /* ---- 顶部标题 ---- */
  .header {
    max-width: 720px;
    margin: 0 auto 64px;
    text-align: center;
  }
  .header .logo {
    font-size: 13px;
    letter-spacing: 0.4em;
    color: #555;
    margin-bottom: 10px;
    padding-left: 0.4em;
  }
  .header .tagline {
    font-size: 12px;
    color: #3a3a3a;
    letter-spacing: 0.15em;
    padding-left: 0.15em;
  }
  .header .line {
    width: 40px; height: 1px;
    background: #2a2a2a;
    margin: 28px auto 0;
  }

  /* ---- 项目区块 ---- */
  .project {
    max-width: 720px;
    margin: 0 auto 72px;
  }
  .project-head {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 6px;
  }
  .project-name {
    font-size: 24px;
    font-weight: 600;
    color: #f0f0f0;
    letter-spacing: 0.05em;
  }
  .project-num {
    font-size: 11px;
    color: #3a3a3a;
    letter-spacing: 0.2em;
    font-variant-numeric: tabular-nums;
  }
  .project-desc {
    font-size: 13px;
    color: #707070;
    line-height: 1.7;
    margin-bottom: 28px;
  }

  /* ---- 原型网格 ---- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
  }

  .card {
    display: block;
    text-decoration: none;
    color: inherit;
    border-radius: 14px;
    overflow: hidden;
    position: relative;
    transition: transform 0.25s cubic-bezier(0.16,1,0.3,1), box-shadow 0.25s;
    aspect-ratio: 4 / 5;
  }
  .card:hover { transform: translateY(-3px); }
  .card:active { transform: translateY(-1px) scale(0.99); }

  .card-bg {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 40px;
    opacity: 0.9;
  }
  .card-overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    justify-content: flex-end;
    padding: 18px 16px;
    background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 55%);
  }
  .card-label {
    font-size: 15px;
    font-weight: 500;
    margin-bottom: 3px;
    letter-spacing: 0.03em;
  }
  .card-hint {
    font-size: 11px;
    opacity: 0.62;
    letter-spacing: 0.02em;
  }
  .card-tag {
    position: absolute; top: 12px; left: 12px;
    font-size: 9px;
    letter-spacing: 0.2em;
    padding: 3px 7px;
    border-radius: 4px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(4px);
    color: #fff;
    opacity: 0.7;
  }

  /* 三套风格的卡片背景 */
  .bg-dark {
    background: linear-gradient(135deg, #0d1117 0%, #161b2c 100%);
    border: 1px solid #1f2937;
  }
  .bg-dark:hover { box-shadow: 0 8px 30px rgba(80,110,180,0.18); }
  .bg-dark .card-bg { filter: drop-shadow(0 0 12px rgba(100,140,220,0.25)); }

  .bg-paper {
    background: linear-gradient(135deg, #f5f1e8 0%, #ebe3d0 100%);
    border: 1px solid #d6cfbe;
  }
  .bg-paper:hover { box-shadow: 0 8px 30px rgba(180,160,120,0.15); }

  .bg-film {
    background: linear-gradient(135deg, #2b1d12 0%, #3d2a18 100%);
    border: 1px solid #4a3622;
  }
  .bg-film:hover { box-shadow: 0 8px 30px rgba(160,110,60,0.2); }

  /* ---- 空位(以后加项目用)---- */
  .empty-project {
    max-width: 720px;
    margin: 0 auto;
    text-align: center;
    padding: 40px 0;
    border: 1px dashed #1f1f22;
    border-radius: 14px;
    color: #2f2f2f;
    font-size: 12px;
    letter-spacing: 0.15em;
  }

  @media (max-width: 480px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .project-name { font-size: 21px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">D O O D L E S</div>
  <div class="tagline">原 型 · 草 稿 · 灵 感</div>
  <div class="line"></div>
</div>

<!-- 项目 01:灵物 -->
<div class="project">
  <div class="project-head">
    <div class="project-name">灵物</div>
    <div class="project-num">— 01</div>
  </div>
  <div class="project-desc">拍一个物件 → 唤醒一个来自异界的灵魂 → 跟它聊天</div>

  <div class="grid">
    <a class="card bg-dark" href="lingwu/dark.html">
      <div class="card-tag">01</div>
      <div class="card-bg">☕</div>
      <div class="card-overlay">
        <div class="card-label">暗夜微光</div>
        <div class="card-hint">深空黑 · 衬线疏离</div>
      </div>
    </a>
    <a class="card bg-paper" href="lingwu/paper.html">
      <div class="card-tag">02</div>
      <div class="card-bg">☕</div>
      <div class="card-overlay">
        <div class="card-label" style="color:#3a342a">纸墨留白</div>
        <div class="card-hint" style="color:#8a7f66">宣纸 · 宋体朱砂</div>
      </div>
    </a>
    <a class="card bg-film" href="lingwu/film.html">
      <div class="card-tag">03</div>
      <div class="card-bg">☕</div>
      <div class="card-overlay">
        <div class="card-label">胶片记忆</div>
        <div class="card-hint">暖褐 · 打字机体</div>
      </div>
    </a>
  </div>
</div>

<!-- 以后加项目,往下复制一个 .project 区块 -->
<div class="empty-project">
  下一个原型 ↓
</div>

</body>
</html>
