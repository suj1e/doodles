<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>doodles — 原型草稿</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    background: #0a0a0c;
    color: #e8e8e8;
    min-height: 100vh;
    padding: 56px 20px 80px;
  }

  /* ---- 顶部标题 ---- */
  .header {
    max-width: 640px;
    margin: 0 auto 56px;
    text-align: center;
  }
  .header .logo {
    font-size: 13px;
    letter-spacing: 0.4em;
    color: #555;
    margin-bottom: 10px;
    padding-left: 0.4em;
  }
  .header .tagline {
    font-size: 12px;
    color: #3a3a3a;
    letter-spacing: 0.15em;
    padding-left: 0.15em;
  }
  .header .line {
    width: 40px; height: 1px;
    background: #2a2a2a;
    margin: 28px auto 0;
  }

  /* ---- 项目列表 ---- */
  .projects {
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .project {
    display: block;
    text-decoration: none;
    color: inherit;
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    transition: transform 0.25s cubic-bezier(0.16,1,0.3,1), box-shadow 0.25s;
    padding: 24px 22px;
    border: 1px solid #1a1a1d;
    background: #0f0f12;
  }
  .project:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,0,0,0.4); }
  .project:active { transform: translateY(0) scale(0.995); }

  .project-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  /* 缩略图:微缩展示该项目的调子 */
  .thumb {
    width: 56px; height: 56px;
    border-radius: 12px;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  /* 灵物:取暗夜微光的调子做代表 */
  .thumb-lingwu {
    background: linear-gradient(135deg, #0d1117 0%, #161b2c 100%);
    border: 1px solid #1f2937;
    box-shadow: inset 0 0 14px rgba(80,110,180,0.18);
  }

  .project-info { flex: 1; min-width: 0; }
  .project-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 5px;
  }
  .project-name {
    font-size: 19px;
    font-weight: 600;
    color: #f0f0f0;
    letter-spacing: 0.03em;
  }
  .project-num {
    font-size: 10px;
    color: #3a3a3a;
    letter-spacing: 0.2em;
    font-variant-numeric: tabular-nums;
  }
  .project-desc {
    font-size: 12.5px;
    color: #707070;
    line-height: 1.6;
  }
  .project-meta {
    font-size: 10px;
    color: #2f2f2f;
    margin-top: 8px;
    letter-spacing: 0.12em;
  }

  .arrow {
    color: #2f2f2f;
    font-size: 18px;
    flex-shrink: 0;
    transition: transform 0.25s, color 0.25s;
  }
  .project:hover .arrow { transform: translateX(3px); color: #555; }

  /* ---- 空位 ---- */
  .empty {
    text-align: center;
    padding: 32px 0;
    color: #1f1f22;
    font-size: 11px;
    letter-spacing: 0.15em;
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">D O O D L E S</div>
  <div class="tagline">原 型 · 草 稿 · 灵 感</div>
  <div class="line"></div>
</div>

<div class="projects">

  <!-- 项目 01:灵物 -->
  <a class="project" href="lingwu/">
    <div class="project-row">
      <div class="thumb thumb-lingwu">☕</div>
      <div class="project-info">
        <div class="project-head">
          <div class="project-name">灵物</div>
          <div class="project-num">— 01</div>
        </div>
        <div class="project-desc">拍一个物件 → 唤醒一个来自异界的灵魂 → 跟它聊天</div>
        <div class="project-meta">3 套风格</div>
      </div>
      <div class="arrow">›</div>
    </div>
  </a>

  <!-- 以后加项目,复制一个 .project 区块 -->

  <div class="empty">下一个 ↓</div>

</div>

</body>
</html>
