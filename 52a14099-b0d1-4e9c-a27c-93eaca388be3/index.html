<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>产品原型 · Doodles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --fg: #111827;
    --muted: #64748b;
    --border: #e5e7eb;
    --accent: #000000;
    --accent-on: #ffffff;
  }
  body {
    font-family: "Geist", "Geist Sans", -apple-system, system-ui, "Segoe UI", "PingFang SC", Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    padding: 64px 24px 80px;
  }

  .header {
    max-width: 720px;
    margin: 0 auto 48px;
    text-align: center;
  }
  .header .label {
    font-size: 12px;
    letter-spacing: 0.3em;
    color: var(--muted);
    margin-bottom: 12px;
    padding-left: 0.3em;
  }
  .header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0;
    margin-bottom: 8px;
  }
  .header .desc {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.6;
  }

  .products {
    max-width: 720px;
    margin: 0 auto;
    display: grid;
    gap: 16px;
  }
  @media (max-width: 520px) {
    .products { grid-template-columns: 1fr; }
  }

  .product-card {
    display: flex;
    align-items: stretch;
    text-decoration: none;
    color: inherit;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--surface);
    transition: box-shadow 0.2s cubic-bezier(0.2,0,0,1), border-color 0.2s;
  }
  .product-card:hover { box-shadow: 0 4px 16px color-mix(in oklab, var(--fg) 8%, transparent); border-color: color-mix(in oklab, var(--fg) 20%, var(--border)); }
  .product-card:active { transform: scale(0.99); }
  .product-card:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }

  @media (prefers-reduced-motion: reduce) {
    .product-card { transition: none; }
    .product-card:active { transform: none; }
  }

  .product-mark {
    width: 88px;
    flex-shrink: 0;
    background: var(--accent);
    color: var(--accent-on);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 700;
  }
  @media (max-width: 520px) {
    .product-mark { width: 64px; font-size: 22px; }
  }

  .product-body {
    flex: 1;
    padding: 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  @media (max-width: 520px) {
    .product-body { padding: 16px; }
  }

  .product-name {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0;
    margin-bottom: 4px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .product-en {
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .product-desc {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 12px;
  }
  .product-meta {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 12px;
    color: var(--muted);
  }
  .product-meta .tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border-radius: 4px;
    background: color-mix(in oklab, var(--fg) 4%, var(--surface));
    font-size: 11px;
    letter-spacing: 0.05em;
  }
  .product-meta .arrow {
    margin-left: auto;
    color: var(--muted);
    transition: transform 0.2s cubic-bezier(0.2,0,0,1), color 0.15s;
  }
  .product-card:hover .product-meta .arrow {
    transform: translateX(4px);
    color: var(--fg);
  }
</style>
</head>
<body>

<header class="header">
  <div class="label">D O O D L E S</div>
  <h1>产品原型</h1>
  <div class="desc">设计原型集合,点击进入各产品的原型导览</div>
</header>

<main class="products">

  <a class="product-card" href="router/weavery.html">
    <div class="product-mark">织</div>
    <div class="product-body">
      <div class="product-name">织云 <span class="product-en">Weavery</span></div>
      <div class="product-desc">AI 内容社区,阅读与创作一体,支持 AI 写作、话题讨论与创作者数据</div>
      <div class="product-meta">
        <span class="tag">16 屏</span>
        <span class="tag">AI 社区</span>
        <span class="arrow">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </span>
      </div>
    </div>
  </a>

</main>
</body>
</html>
