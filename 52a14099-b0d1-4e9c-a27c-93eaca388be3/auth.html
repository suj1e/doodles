<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>织云 · 登录</title>
<style>
/* ============================================================
 织云 登录 / 注册 / 忘记密码
   设计系统:shadcn 风格 — 极简中性、黑白主色、克制的留白与描边
   ============================================================ */

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }

:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --fg: #111827;
  --muted: #64748b;
  --border: #e5e7eb;
  --accent: #000000;
  --accent-on: #ffffff;
  --accent-hover: color-mix(in oklab, var(--accent), white 10%);
  --accent-active: color-mix(in oklab, var(--accent), white 18%);
  --success: #16a34a;
  --warn: #d97706;
  --danger: #dc2626;
  --font-display: "Geist", "Geist Sans", -apple-system, system-ui, "Segoe UI", Arial, sans-serif;
  --font-body: "Geist", "Geist Sans", -apple-system, system-ui, "Segoe UI", Arial, sans-serif;
  --font-mono: "Fira Code", ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Monaco, Consolas, monospace;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --elev-raised:
    0 1px 2px 0 color-mix(in oklab, var(--fg), transparent 92%),
    0 1px 3px 0 color-mix(in oklab, var(--fg), transparent 88%);
  --elev-ring: 0 0 0 1px var(--border);
  --focus-ring: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
  --motion-fast: 150ms;
  --motion-base: 200ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
}

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--fg);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 32px 20px;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; border: none; background: none; cursor: pointer; color: inherit; }
input { font: inherit; }

a:focus-visible, button:focus-visible, input:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
  border-radius: var(--radius-sm);
}

.icon { width: 16px; height: 16px; flex: none; }

/* ---------- 主卡片 ---------- */
.auth-card {
  width: 100%;
  max-width: 960px;
  display: grid;
  grid-template-columns: 0.95fr 1.05fr;
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--elev-raised);
}

/* 左侧品牌区 */
.auth-brand {
  position: relative;
  background: var(--accent);
  color: var(--accent-on);
  padding: 44px 40px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}
.auth-brand::after {
  content: "";
  position: absolute; inset: 0;
  background: radial-gradient(120% 90% at 110% 0%, color-mix(in oklab, var(--accent-on) 10%, transparent), transparent 55%);
  pointer-events: none;
}
.brand-row { display: flex; align-items: center; gap: 10px; border-radius: var(--radius-sm); transition: opacity var(--motion-fast) var(--ease-standard); }
a.brand-row:hover { opacity: .85; }
a.brand-row:focus-visible { box-shadow: var(--focus-ring); }
.brand-mark {
  width: 32px; height: 32px; border-radius: var(--radius-sm);
  display: grid; place-items: center;
  background: var(--accent-on); color: var(--accent);
  font-weight: 800; font-size: 17px;
}
.brand-word { font-size: 21px; font-weight: 800; letter-spacing: -0.02em; color: var(--fg); }
.auth-brand .brand-word { color: var(--accent-on); }
.brand-en { margin-left: 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); display: none; }
@media (min-width: 768px) { .brand-en { display: inline-block; } }
.auth-brand .brand-en { color: color-mix(in oklab, var(--accent-on) 62%, transparent); }
.auth-slogan { font-size: 17px; line-height: 1.55; font-weight: 600; max-width: 15em; }
.auth-slogan em { font-style: normal; color: color-mix(in oklab, var(--accent-on) 78%, transparent); }

.auth-points { margin-top: 8px; display: flex; flex-direction: column; gap: 14px; }
.auth-point { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; line-height: 1.6; color: color-mix(in oklab, var(--accent-on) 88%, transparent); }
.auth-point .icon { width: 15px; height: 15px; margin-top: 3px; color: color-mix(in oklab, var(--accent-on) 70%, transparent); flex: none; }

.auth-quote {
  margin-top: auto;
  border-top: 1px solid color-mix(in oklab, var(--accent-on) 22%, transparent);
  padding-top: 18px;
  font-size: 13px; line-height: 1.7;
  color: color-mix(in oklab, var(--accent-on) 72%, transparent);
}
.auth-quote b { display: block; margin-top: 6px; color: var(--accent-on); font-weight: 700; }

/* 右侧表单区 */
.auth-main { padding: 40px 44px; display: flex; flex-direction: column; justify-content: center; background: var(--surface); }
.auth-modes { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 26px; }
.mode {
  position: relative;
  padding: 10px 2px 12px;
  margin-right: 20px;
  font-size: 16px; font-weight: 500; color: var(--muted);
  border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  transition: color var(--motion-fast) var(--ease-standard);
}
.mode:hover { color: var(--fg); }
.mode:focus-visible { box-shadow: var(--focus-ring); }
.mode.is-active { color: var(--fg); font-weight: 600; }
.mode.is-active::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px;
  height: 2px; border-radius: 2px; background: var(--accent);
}

.auth-form { display: none; }
.auth-form.is-active { display: block; }

.field { margin-bottom: 18px; }
.field-label { display: flex; align-items: baseline; justify-content: space-between; font-size: 13px; font-weight: 600; color: var(--fg); margin-bottom: 7px; }
.field-label .hint { font-size: 12px; color: var(--muted); font-weight: 500; }
.field-label .hint a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
.field-label .hint a:hover { color: var(--accent); }
.field-label .hint a:focus-visible { box-shadow: var(--focus-ring); border-radius: var(--radius-sm); }

.input-wrap { position: relative; }
.input-wrap .icon {
  position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
  color: var(--muted); width: 16px; height: 16px; pointer-events: none;
}
.input {
  width: 100%; height: 44px;
  padding: 0 14px 0 38px;
  border: 1px solid var(--border); border-radius: var(--radius-md);
  background: var(--surface); color: var(--fg);
  font-size: 15px;
  transition: border-color var(--motion-fast) var(--ease-standard), box-shadow var(--motion-fast) var(--ease-standard);
}
.input::placeholder { color: color-mix(in oklab, var(--muted) 72%, transparent); }
.input:hover { border-color: var(--fg); }
.input:focus, .input:focus-visible { outline: none; border-color: var(--accent); box-shadow: var(--focus-ring); }

.pwd-toggle {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  width: 32px; height: 32px; border-radius: var(--radius-sm);
  display: grid; place-items: center; color: var(--muted);
  transition: color var(--motion-fast) var(--ease-standard), background-color var(--motion-fast) var(--ease-standard);
}
.pwd-toggle:hover { color: var(--fg); background: color-mix(in oklab, var(--border) 40%, var(--surface)); }
.pwd-toggle:focus-visible { box-shadow: var(--focus-ring); }
.pwd-toggle .icon { width: 16px; height: 16px; }

.field-actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 4px 0 20px; }
.check-row { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; user-select: none; }
.check-row input { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
.check-row input:focus-visible { box-shadow: var(--focus-ring); border-radius: 3px; }
.link-mini { font-size: 13px; color: var(--muted); padding: 4px 6px; border-radius: var(--radius-sm); transition: color var(--motion-fast) var(--ease-standard); }
.link-mini:hover { color: var(--accent); }
.link-mini:focus-visible { box-shadow: var(--focus-ring); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 44px; padding: 0 18px; border-radius: var(--radius-md);
  font-size: 15px; font-weight: 600;
  transition: background-color var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard), box-shadow var(--motion-fast) var(--ease-standard), transform .1s ease;
}
.btn:active { transform: translateY(1px); }
.btn-primary { width: 100%; background: var(--accent); color: var(--accent-on); box-shadow: var(--elev-ring); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:active { background: var(--accent-active); }
.btn-primary:focus-visible { outline: none; box-shadow: var(--focus-ring); }

.divider { display: flex; align-items: center; gap: 12px; margin: 22px 0 18px; color: var(--muted); font-size: 12px; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

.social-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.btn-social {
  height: 42px; border: 1px solid var(--border); border-radius: var(--radius-md);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 14px; font-weight: 600; color: var(--fg); background: var(--surface);
  transition: border-color var(--motion-fast) var(--ease-standard), background-color var(--motion-fast) var(--ease-standard);
}
.btn-social:hover { border-color: var(--fg); background: color-mix(in oklab, var(--border) 25%, var(--surface)); }
.btn-social:focus-visible { box-shadow: var(--focus-ring); }
.btn-social .icon { width: 15px; height: 15px; }

.agree-note { margin-top: 16px; font-size: 12px; color: var(--muted); line-height: 1.6; text-align: center; }
.agree-note a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
.agree-note a:hover { color: var(--accent); }
.agree-note a:focus-visible { box-shadow: var(--focus-ring); border-radius: var(--radius-sm); }

.form-foot { margin-top: 20px; text-align: center; font-size: 14px; color: var(--muted); }
.form-foot button { font-size: 14px; font-weight: 600; color: var(--accent); padding: 4px 6px; border-radius: var(--radius-sm); transition: opacity var(--motion-fast) var(--ease-standard); }
.form-foot button:hover { opacity: .7; }
.form-foot button:focus-visible { box-shadow: var(--focus-ring); }

/* 轻提示 */
.toast {
  position: fixed; left: 50%; bottom: 28px;
  transform: translate(-50%, 20px);
  opacity: 0; pointer-events: none;
  background: var(--fg); color: var(--bg);
  font-size: var(--radius-md); font-weight: 600;
  font-size: 14px;
  padding: 11px 18px; border-radius: var(--radius-md);
  box-shadow: var(--elev-raised);
  transition: opacity var(--motion-base) var(--ease-standard), transform var(--motion-base) var(--ease-standard);
  z-index: 100;
}
.toast.is-show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- 动效(入场 + 模式切换交叉淡化) ---------- */
@keyframes card-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes pane-in {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
.auth-card {
  animation: card-in var(--motion-base) var(--ease-standard) backwards;
}
.auth-form.is-active {
  animation: pane-in var(--motion-base) var(--ease-standard);
}
@media (prefers-reduced-motion: reduce) {
  .auth-card, .auth-form.is-active { animation: none !important; }
}

/* ---------- 响应式 ---------- */
@media (max-width: 820px) {
  .auth-card { grid-template-columns: 1fr; max-width: 460px; }
  .auth-brand { padding: 28px 26px; }
  .auth-points { display: none; }
  .auth-quote { display: none; }
  .auth-main { padding: 30px 26px; }
}
@media (max-width: 480px) {
  body { padding: 24px 14px; }
  .auth-brand { padding: 24px 20px; }
  .auth-main { padding: 24px 20px; }
  .social-row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="auth-card" data-od-id="auth-card">

  <!-- 左侧品牌区 -->
  <aside class="auth-brand" data-od-id="auth-brand">
    <a class="brand-row" href="feed.html" aria-label="返回织云首页" data-od-id="auth-back">
      <span class="brand-mark">织</span>
      <span class="brand-word">织云</span><span class="brand-en">Weavery</span>
    </a>
    <p class="auth-slogan">阅读、讨论,<em>用 AI 开始创作</em>。你的想法,值得被更多人看见。</p>
    <div class="auth-points">
      <div class="auth-point">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9M5 5l14 14-4 1-2-2z"/></svg>
        AI 写作工作台:起稿、润色、续写,一键成文
      </div>
      <div class="auth-point">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6Z"/><path d="M10.5 20a2 2 0 0 0 3 0"/></svg>
        关注作者与话题,不错过任何一条好内容
      </div>
      <div class="auth-point">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8 8 8 0 0 1 8 8Z"/></svg>
        和志同道合的人讨论,让写作不再孤独
      </div>
    </div>
    <blockquote class="auth-quote">
      「我在这里第一次用 AI 写完一篇想写很久的文章。」
      <b>— 云小织 · 认证 AI 作者</b>
    </blockquote>
  </aside>

  <!-- 右侧表单区 -->
  <main class="auth-main" data-od-id="auth-main">
    <div class="auth-modes" role="tablist" aria-label="登录方式">
      <button class="mode is-active" type="button" data-mode="login" data-od-id="mode-login" role="tab" aria-selected="true">登录</button>
      <button class="mode" type="button" data-mode="register" data-od-id="mode-register" role="tab" aria-selected="false">注册</button>
      <button class="mode" type="button" data-mode="forgot" data-od-id="mode-forgot" role="tab" aria-selected="false">忘记密码</button>
    </div>

    <!-- 登录 -->
    <form class="auth-form is-active" id="form-login" data-mode-pane="login" data-od-id="form-login" novalidate>
      <div class="field">
        <label class="field-label" for="login-email">邮箱</label>
        <div class="input-wrap">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          <input class="input" id="login-email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
      </div>
      <div class="field">
        <label class="field-label" for="login-pwd">密码</label>
        <div class="input-wrap">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <input class="input" id="login-pwd" name="password" type="password" placeholder="输入密码" autocomplete="current-password" required>
          <button class="pwd-toggle" type="button" data-pwd-toggle="login-pwd" aria-label="显示密码">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="field-actions">
        <label class="check-row">
          <input type="checkbox" checked>
          记住我
        </label>
        <button class="link-mini" type="button" data-jump="forgot" data-od-id="login-forgot">忘记密码?</button>
      </div>
      <button class="btn btn-primary" type="submit" data-od-id="submit-login">登录</button>
      <div class="form-foot">还没有账号?<button type="button" data-jump="register" data-od-id="login-to-register">立即注册</button></div>
    </form>

    <!-- 注册 -->
    <form class="auth-form" id="form-register" data-mode-pane="register" data-od-id="form-register" novalidate>
      <div class="field">
        <label class="field-label" for="reg-nick">昵称</label>
        <div class="input-wrap">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
          <input class="input" id="reg-nick" name="nick" type="text" placeholder="社区里大家怎么称呼你" autocomplete="nickname" required>
        </div>
      </div>
      <div class="field">
        <label class="field-label" for="reg-email">邮箱</label>
        <div class="input-wrap">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          <input class="input" id="reg-email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
      </div>
      <div class="field">
        <label class="field-label" for="reg-pwd">密码<span class="hint">至少 8 位</span></label>
        <div class="input-wrap">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <input class="input" id="reg-pwd" name="password" type="password" placeholder="设置登录密码" autocomplete="new-password" required>
          <button class="pwd-toggle" type="button" data-pwd-toggle="reg-pwd" aria-label="显示密码">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="field-actions">
        <label class="check-row">
          <input type="checkbox" required>
          我同意 <a href="guidelines.html" style="color:var(--muted);text-decoration:underline;text-underline-offset:2px;">社区准则</a>
        </label>
      </div>
      <button class="btn btn-primary" type="submit" data-od-id="submit-register">创建账号</button>
      <div class="form-foot">已经有账号?<button type="button" data-jump="login" data-od-id="register-to-login">直接登录</button></div>
    </form>

    <!-- 忘记密码 -->
    <form class="auth-form" id="form-forgot" data-mode-pane="forgot" data-od-id="form-forgot" novalidate>
      <p class="field-label" style="margin-bottom:8px;">输入注册邮箱,我们会发送一封重置密码的链接给你。</p>
      <div class="field">
        <label class="field-label" for="forgot-email">邮箱</label>
        <div class="input-wrap">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          <input class="input" id="forgot-email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
      </div>
      <button class="btn btn-primary" type="submit" data-od-id="submit-forgot">发送重置邮件</button>
      <div class="form-foot">想起密码了?<button type="button" data-jump="login" data-od-id="forgot-to-login">返回登录</button></div>
    </form>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var toast = $("toast");
  var toastTimer = null;

  var nextParam = "feed.html";
  (function () {
    var m = location.search.match(/[?&]next=([^&]+)/);
    if (m) nextParam = decodeURIComponent(m[1]);
    if (!/\.html$/.test(nextParam)) nextParam = "feed.html";
  })();

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("is-show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove("is-show"); }, 2200);
  }

  /* ---------- 模式切换 ---------- */
  var modes = Array.prototype.slice.call(document.querySelectorAll(".mode"));
  var panes = {};
  modes.forEach(function (m) { panes[m.dataset.mode] = document.querySelector('[data-mode-pane="' + m.dataset.mode + '"]'); });

  function setMode(key) {
    modes.forEach(function (m) {
      var on = m.dataset.mode === key;
      m.classList.toggle("is-active", on);
      m.setAttribute("aria-selected", on ? "true" : "false");
    });
    Object.keys(panes).forEach(function (k) {
      panes[k].classList.toggle("is-active", k === key);
    });
  }
  modes.forEach(function (m) {
    m.addEventListener("click", function () { setMode(m.dataset.mode); });
  });
  Array.prototype.slice.call(document.querySelectorAll("[data-jump]")).forEach(function (btn) {
    btn.addEventListener("click", function () { setMode(btn.dataset.jump); });
  });
  (function () {
    var mm = location.search.match(/[?&]mode=([^&]+)/);
    if (mm && panes[mm[1]]) setMode(mm[1]);
  })();

  /* ---------- 密码显隐 ---------- */
  Array.prototype.slice.call(document.querySelectorAll("[data-pwd-toggle]")).forEach(function (btn) {
    btn.addEventListener("click", function () {
      var input = $(btn.dataset.pwdToggle);
      if (!input) return;
      input.type = input.type === "password" ? "text" : "password";
    });
  });

  /* ---------- 提交 ---------- */
  function simulateSubmit(form, okMsg, next) {
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var valid = true;
      Array.prototype.slice.call(form.querySelectorAll("input[required]")).forEach(function (input) {
        if (!input.value.trim()) valid = false;
      });
      if (!valid) { showToast("请填写完整信息"); return; }
      var btn = form.querySelector('[type="submit"]');
      var orig = btn.textContent;
      btn.style.pointerEvents = "none";
      btn.style.opacity = ".6";
      setTimeout(function () {
        btn.style.pointerEvents = "";
        btn.style.opacity = "";
        showToast(okMsg);
        setTimeout(function () {
          try { localStorage.setItem("weavery-auth", "in"); } catch (_) {}
          if (next) location.href = next;
        }, 700);
      }, 900);
    });
  }
  simulateSubmit($("form-login"), "登录成功,欢迎回来", nextParam);
  simulateSubmit($("form-register"), "注册成功,已为你登录", nextParam);
  simulateSubmit($("form-forgot"), "重置邮件已发送,请查收", null);

  /* Esc: 返回首页 */
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      var a = document.querySelector('[data-od-id="auth-back"]');
      if (a) location.href = a.getAttribute("href");
    }
  });
})();
</script>
</body>
</html>
