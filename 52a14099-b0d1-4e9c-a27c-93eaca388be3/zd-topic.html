<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>话题 · zd</title>
<style>
/* ============================================================
   zd 话题详情 — 话题聚合页
   设计系统:shadcn 风格 — 极简中性、黑白主色、克制的留白与描边
   ============================================================ */

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }

:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-warm: var(--surface);
  --fg: #111827;
  --fg-2: var(--fg);
  --muted: #64748b;
  --meta: var(--muted);
  --border: #e5e7eb;
  --border-soft: var(--border);
  --accent: #000000;
  --accent-on: #ffffff;
  --accent-hover: color-mix(in oklab, var(--accent), white 10%);
  --accent-active: color-mix(in oklab, var(--accent), white 18%);
  --success: #16a34a;
  --warn: #d97706;
  --danger: #dc2626;
  --font-display: "Geist", "Geist Sans", -apple-system, system-ui, "Segoe UI", Arial, sans-serif;
  --font-body: "Geist", "Geist Sans", -apple-system, system-ui, "Segoe UI", Arial, sans-serif;
  --font-mono: "Fira Code", ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Monaco, Consolas, monospace;
  --text-xs: 12px;
  --text-sm: 14px;
  --text-base: 16px;
  --text-lg: 20px;
  --text-xl: 24px;
  --text-2xl: 32px;
  --text-3xl: 40px;
  --text-4xl: 48px;
  --leading-body: 1.5;
  --leading-tight: 1.2;
  --tracking-display: -0.02em;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-pill: 9999px;
  --elev-flat: none;
  --elev-ring: 0 0 0 1px var(--border);
  --elev-raised:
    0 1px 2px 0 color-mix(in oklab, var(--fg), transparent 92%),
    0 1px 3px 0 color-mix(in oklab, var(--fg), transparent 88%);
  --focus-ring: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
  --motion-fast: 150ms;
  --motion-base: 200ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --container-max: 1280px;
  --container-gutter-desktop: 24px;
  --container-gutter-tablet: 16px;
  --container-gutter-phone: 16px;
}

/* ---------- 基础 ---------- */
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--fg);
  font-size: 15px;
  line-height: var(--leading-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
a { color: inherit; text-decoration: none; }
img, svg { display: block; }
button { font: inherit; border: none; background: none; cursor: pointer; color: inherit; }
::selection { background: color-mix(in oklab, var(--accent) 12%, var(--surface)); }

a:focus-visible, button:focus-visible, input:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
  border-radius: var(--radius-sm);
}

.container { max-width: var(--container-max); margin: 0 auto; padding: 0 var(--container-gutter-desktop); }
.icon { width: 16px; height: 16px; flex: none; }

/* ---------- 顶栏 ---------- */
.site-header {
  position: sticky; top: 0; z-index: 50;
  background: color-mix(in oklab, var(--bg) 82%, transparent);
  -webkit-backdrop-filter: blur(14px) saturate(1.4);
  backdrop-filter: blur(14px) saturate(1.4);
  border-bottom: 1px solid var(--border);
}
.header-row { display: flex; align-items: center; gap: 20px; height: 60px; }
.brand { display: flex; align-items: center; gap: 7px; flex: none; }
.brand-mark {
  width: 28px; height: 28px; border-radius: var(--radius-sm);
  display: grid; place-items: center;
  background: var(--accent); color: var(--accent-on);
  font-weight: 700; font-size: 15px;
}
.brand-word { font-size: 21px; font-weight: 800; letter-spacing: var(--tracking-display); color: var(--fg); }

.search { flex: 1; max-width: 420px; margin: 0 auto; position: relative; }
.search input {
  width: 100%; height: 38px; padding: 0 52px 0 38px;
  border: 1px solid var(--border); border-radius: var(--radius-md);
  background: var(--surface); color: var(--fg);
  font-size: var(--text-sm);
  transition: border-color var(--motion-fast) var(--ease-standard), box-shadow var(--motion-fast) var(--ease-standard);
}
.search input::placeholder { color: var(--muted); }
.search input:hover { border-color: var(--fg); }
.search input:focus, .search input:focus-visible {
  outline: none; border-color: var(--accent); box-shadow: var(--focus-ring);
}
.search-icon {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  color: var(--muted); pointer-events: none;
}
.search-kbd {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  font-family: var(--font-mono); font-size: 11px; color: var(--muted);
  background: var(--surface); border: 1px solid var(--border); border-bottom-width: 2px;
  border-radius: var(--radius-sm); padding: 1px 6px; pointer-events: none; white-space: nowrap;
}

.header-actions { display: flex; align-items: center; gap: 14px; flex: none; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 38px; padding: 0 16px; border-radius: var(--radius-md);
  font-size: var(--text-sm); font-weight: 600;
  transition: background-color var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard), box-shadow var(--motion-fast) var(--ease-standard), transform .1s ease;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent); color: var(--accent-on); box-shadow: var(--elev-ring); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:active { background: var(--accent-active); }
.btn-primary:focus-visible { outline: none; box-shadow: var(--focus-ring); }

.avatar {
  width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center;
  color: var(--accent-on); font-size: 13px; font-weight: 700;
  border: 1px solid var(--border);
  transition: transform var(--motion-fast) var(--ease-standard);
}
.avatar:hover { transform: scale(1.05); }

.header-login {
  display: inline-flex; align-items: center;
  height: 38px; padding: 0 14px;
  border-radius: var(--radius-md);
  font-size: var(--text-sm); font-weight: 600;
  color: var(--muted);
  border: 1px solid var(--border);
  background: var(--surface);
  transition: color var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), background-color var(--motion-fast) var(--ease-standard);
}
.header-login:hover { color: var(--fg); border-color: var(--fg); }
.header-login:focus-visible { box-shadow: var(--focus-ring); }

.icon-btn {
  position: relative;
  display: grid; place-items: center;
  width: 38px; height: 38px;
  border-radius: var(--radius-md);
  color: var(--fg);
  border: 1px solid var(--border);
  background: var(--surface);
  transition: color var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), background-color var(--motion-fast) var(--ease-standard);
}
.icon-btn:hover { border-color: var(--fg); background: color-mix(in oklab, var(--border) 40%, var(--surface)); }
.mobile-search { display: none; }
.icon-btn:focus-visible { box-shadow: var(--focus-ring); }
.icon-btn .icon { width: 17px; height: 17px; }
.bell-dot {
  position: absolute; top: 7px; right: 8px;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent);
  border: 1.5px solid var(--surface);
}
.icon-btn.is-open { border-color: var(--fg); background: color-mix(in oklab, var(--border) 40%, var(--surface)); }

/* 通知浮窗 */
.notif-wrap { position: relative; }
.notif-pop {
  position: absolute;
  top: calc(100% + 10px);
  right: 0;
  width: 344px;
  max-width: calc(100vw - 32px);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--elev-raised);
  z-index: 60;
  opacity: 0;
  visibility: hidden;
  transform: translateY(-4px);
  transition: opacity var(--motion-base) var(--ease-standard), transform var(--motion-base) var(--ease-standard), visibility 0s linear var(--motion-base);
}
.notif-pop.is-open {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
  transition: opacity var(--motion-base) var(--ease-standard), transform var(--motion-base) var(--ease-standard);
}
.notif-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--border);
}
.notif-head h3 { font-size: var(--text-base); font-weight: 600; color: var(--fg); }
.notif-readall {
  font-size: var(--text-xs); color: var(--muted);
  border: 0; background: none; padding: 4px 6px; border-radius: var(--radius-sm);
  cursor: pointer;
  transition: color var(--motion-fast) var(--ease-standard);
}
.notif-readall:hover { color: var(--fg); }
.notif-readall:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.notif-list { padding: 4px 0; max-height: 300px; overflow-y: auto; }
.notif-item {
  display: flex; gap: 10px;
  padding: 11px 16px;
  position: relative;
}
.notif-item + .notif-item { border-top: 1px solid var(--border-soft); }
.notif-item.is-unread { background: color-mix(in oklab, var(--border) 26%, var(--surface)); }
.notif-item:hover { background: color-mix(in oklab, var(--border) 40%, var(--surface)); }
.notif-item .icon { width: 16px; height: 16px; flex: none; margin-top: 2px; color: var(--muted); }
.notif-item.is-unread .icon { color: var(--accent); }
.notif-body { min-width: 0; }
.notif-text { font-size: var(--text-sm); line-height: var(--leading-body); color: var(--fg); }
.notif-text strong { font-weight: 600; }
.notif-text em { font-style: normal; color: var(--muted); }
.notif-time { display: block; margin-top: 3px; font-size: var(--text-xs); color: var(--muted); }
.notif-unread-dot {
  position: absolute; left: 8px; top: 16px;
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent);
}
.notif-foot {
  padding: 10px 16px 14px;
  border-top: 1px solid var(--border);
  text-align: center;
}
.notif-foot a {
  display: inline-block;
  font-size: var(--text-sm); font-weight: 500; color: var(--fg);
  padding: 6px 12px; border-radius: var(--radius-sm);
  transition: background-color var(--motion-fast) var(--ease-standard);
}
.notif-foot a:hover { background: color-mix(in oklab, var(--border) 50%, var(--surface)); }
.notif-foot a:focus-visible { outline: none; box-shadow: var(--focus-ring); }

/* AI 徽标 / 标签 */
.badge-ai {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--font-mono);
  font-size: var(--text-xs); font-weight: 600;
  color: var(--accent);
  border: 1px solid var(--accent);
  border-radius: var(--radius-pill);
  padding: 2px 9px;
  background: var(--surface);
}
.badge-ai .icon { width: 12px; height: 12px; }
.model-tag {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  color: var(--muted);
  background: color-mix(in oklab, var(--border) 30%, var(--surface));
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
  padding: 2px 8px;
}
.author-role.ai { color: var(--accent-on); background: var(--accent); border-color: var(--accent); }
.tag {
  font-size: var(--text-xs); font-weight: 600;
  color: var(--fg);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 2px 8px;
  transition: color var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), background-color var(--motion-fast) var(--ease-standard);
}
.tag:hover { color: var(--accent); border-color: var(--accent); background: color-mix(in oklab, var(--accent) 5%, var(--surface)); }
.avatar-sm {
  width: 26px; height: 26px; border-radius: 50%;
  display: grid; place-items: center;
  color: var(--accent-on); font-size: 12px; font-weight: 700; flex: none;
}
.avatar-g1 { background: linear-gradient(135deg, oklch(46% 0.01 250), oklch(35% 0.01 250)); }
.avatar-g2 { background: linear-gradient(135deg, oklch(55% 0.01 250), oklch(43% 0.01 250)); }
.avatar-g3 { background: linear-gradient(135deg, oklch(40% 0.01 250), oklch(29% 0.01 250)); }
.avatar-g4 { background: linear-gradient(135deg, oklch(62% 0.01 250), oklch(50% 0.01 250)); }

/* ---------- 话题头部 ---------- */
.topic-hero {
  display: flex; gap: 24px; align-items: flex-start;
  padding: 40px 0 28px;
}
.topic-hero-main { min-width: 0; flex: 1; }
.topic-kicker { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.topic-hash {
  font-family: var(--font-mono);
  font-size: 26px; font-weight: 700;
  color: var(--muted);
  line-height: 1;
}
.topic-name {
  font-family: var(--font-display);
  font-size: var(--text-2xl); font-weight: 800;
  letter-spacing: var(--tracking-display);
  color: var(--fg);
  line-height: 1;
}
.topic-desc {
  margin-top: 12px;
  font-size: var(--text-base); line-height: 1.7;
  color: var(--muted); max-width: 54em;
}
.topic-meta {
  margin-top: 12px;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  font-size: var(--text-sm); color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.topic-meta .sep { width: 1px; height: 12px; background: var(--border); }
.topic-hero-actions { flex: none; display: flex; gap: 10px; }

.follow-btn {
  flex: none;
  height: 38px; padding: 0 18px;
  border-radius: var(--radius-md);
  font-size: var(--text-sm); font-weight: 600;
  color: var(--accent);
  border: 1px solid var(--border);
  background: var(--surface);
  transition: background-color var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard);
}
.follow-btn:hover { background: var(--accent); color: var(--accent-on); border-color: var(--accent); }
.follow-btn:focus-visible { box-shadow: var(--focus-ring); }
.follow-btn.is-followed {
  color: var(--muted);
  background: color-mix(in oklab, var(--border) 40%, var(--surface));
  border-color: var(--border);
}
.follow-btn.is-followed:hover { color: var(--fg); background: color-mix(in oklab, var(--border) 60%, var(--surface)); }

/* ---------- 主布局 ---------- */
.layout {
  display: grid;
  grid-template-columns: minmax(0, 720px) minmax(0, 320px);
  justify-content: center;
  gap: 48px;
  align-items: start;
  padding: 6px 0 64px;
}
.feed { min-width: 0; }
.sort-row { display: flex; align-items: center; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
.srtab {
  position: relative; flex: none;
  padding: 9px 12px;
  font-size: var(--text-sm); font-weight: 500; color: var(--muted);
  border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  transition: color var(--motion-fast) var(--ease-standard), background-color var(--motion-fast) var(--ease-standard);
}
.srtab:hover { color: var(--fg); background: color-mix(in oklab, var(--border) 30%, var(--surface)); }
.srtab:focus-visible { box-shadow: var(--focus-ring); }
.srtab.is-active { color: var(--fg); font-weight: 600; }
.srtab.is-active::after {
  content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px;
  height: 2px; border-radius: 2px; background: var(--accent);
}

.feed-list { display: flex; flex-direction: column; gap: 20px; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  cursor: pointer;
  transition: border-color var(--motion-base) var(--ease-standard), box-shadow var(--motion-base) var(--ease-standard), transform var(--motion-base) var(--ease-standard);
}
.card:hover {
  border-color: color-mix(in oklab, var(--fg) 20%, var(--surface));
  box-shadow: var(--elev-raised);
  transform: translateY(-2px);
}
.card-body { padding: 22px 24px 20px; }
.card-meta-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.readtime { font-size: var(--text-xs); color: var(--muted); }
.card-title { font-size: 20px; line-height: var(--leading-tight); font-weight: 700; color: var(--fg); margin: 10px 0 8px; letter-spacing: -0.01em; }
.card-title a { transition: color var(--motion-fast) var(--ease-standard); }
.card-title a:hover { color: var(--accent); }
.card-excerpt {
  font-size: var(--text-base); line-height: var(--leading-body);
  color: var(--muted);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card-footer {
  display: flex; align-items: center; gap: 8px; row-gap: 8px; flex-wrap: wrap;
  margin-top: 16px;
  font-size: var(--text-sm); color: var(--muted);
}
.card-footer .dot { opacity: .45; }
.author { font-weight: 600; color: var(--fg); transition: color var(--motion-fast) var(--ease-standard); }
.author:hover { color: var(--accent); }
.author-role {
  font-size: 11px; font-weight: 600;
  color: var(--accent);
  background: color-mix(in oklab, var(--accent) 6%, var(--surface));
  border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 1px 6px;
}
.spacer { flex: 1; }
.stat { display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.stat .icon { width: 14px; height: 14px; }
.like-btn {
  display: inline-flex; align-items: center; gap: 4px;
  color: var(--muted);
  padding: 4px 6px; margin: -4px -6px;
  border-radius: var(--radius-sm);
  transition: color var(--motion-fast) var(--ease-standard), background-color var(--motion-fast) var(--ease-standard);
}
.like-btn:hover { color: var(--fg); background: color-mix(in oklab, var(--border) 40%, var(--surface)); }
.like-btn:focus-visible { box-shadow: var(--focus-ring); }
.like-btn .icon { width: 14px; height: 14px; }
.like-btn.is-liked { color: var(--accent); }
.like-btn.is-liked .icon { fill: var(--accent); stroke: var(--accent); }

/* ---------- 侧边栏 ---------- */
.sidebar {
  position: sticky; top: 128px;
  display: flex; flex-direction: column; gap: 20px;
}
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
}
.panel-title {
  display: flex; align-items: center; gap: 8px;
  font-size: var(--text-sm); font-weight: 700;
  color: var(--fg);
  margin-bottom: 10px;
}
.topic {
  display: flex; align-items: baseline; gap: 12px;
  padding: 9px 4px;
  border-radius: var(--radius-sm);
  transition: background-color var(--motion-fast) var(--ease-standard);
}
.topic:hover { background: color-mix(in oklab, var(--border) 40%, var(--surface)); }
.topic-rank {
  width: 18px; flex: none;
  font-size: var(--text-sm); font-weight: 700;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.topic-name { font-size: var(--text-sm); font-weight: 600; color: var(--fg); transition: color var(--motion-fast) var(--ease-standard); }
.topic-name:hover { color: var(--accent); }
.topic-count {
  margin-left: auto;
  font-size: var(--text-xs); color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.rule-text { font-size: var(--text-sm); line-height: 1.7; color: var(--muted); }
.rule-text strong { color: var(--fg); font-weight: 600; }

/* ---------- 页脚 ---------- */
.site-footer { border-top: 1px solid var(--border); background: var(--bg); }
.footer-inner {
  display: flex; align-items: center; gap: 20px; height: 72px;
  font-size: var(--text-sm); color: var(--muted);
}
.footer-brand { font-size: 16px; font-weight: 800; letter-spacing: var(--tracking-display); color: var(--fg); }
.footer-links { margin-left: auto; display: flex; gap: 20px; }
.footer-links a { transition: color var(--motion-fast) var(--ease-standard); }
.footer-links a:hover { color: var(--fg); }

/* ---------- 响应式 ---------- */
@media (max-width: 1020px) {
  .sidebar { display: none; }
  .layout { grid-template-columns: minmax(0, 720px); }
}
@media (max-width: 760px) {
  .container { padding: 0 var(--container-gutter-phone); }
  .notif-pop { position: fixed; top: 66px; right: 12px; width: min(344px, calc(100vw - 24px)); }
  .search { display: none; }
  .mobile-search { display: grid; }
  .header-actions { margin-left: auto; }
  .brand-word { font-size: 19px; }
  .topic-hero { flex-direction: column; gap: 16px; padding: 28px 0 20px; }
  .topic-hero-actions { width: 100%; }
  .topic-hero-actions .btn { flex: 1; }
  .topic-name { font-size: 26px; }
  .layout { padding: 0 0 48px; }
  .footer-links { display: none; }
}
</style>

  var params = new URLSearchParams(location.search);
  var tName = params.get("t");
  var topic = TOPICS[tName] || TOPICS["AI 编程"];

  function fmtLike(n) { return fmt(n); }

  function authorHref(name) {
    var map = { "陈默": "chenmo", "林晚": "linwan", "织云": "zhiyun", "苏航": "suhang", "顾南": "gunan" };
    var k = map[name];
    return k ? "zd-profile.html?user=" + k : "zd-profile.html";
  }

  function renderPost(p) {
    var meta = '<div class="card-meta-top">';
    p.tags.forEach(function (t) { meta += '<span class="tag">' + t + "</span>"; });
    if (p.ai) {
      meta += '<span class="badge-ai"><svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c.5 3.7 3 6.2 6.7 6.7-3.7.5-6.2 3-6.7 6.7C11.5 11.7 9 9.2 5.3 8.7 9 8.2 11.5 5.7 12 2Z"/><path d="M19 14c.3 1.9 1.6 3.2 3.5 3.5-1.9.3-3.2 1.6-3.5 3.5-.3-1.9-1.6-3.2-3.5-3.5 1.9-.3 3.2-1.6 3.5-3.5Z"/></svg>基于 AI 生成</span>';
      meta += '<span class="model-tag">' + p.model + "</span>";
    }
    meta += '<span class="readtime">' + (p.role === "AI 作者" ? "约 3 分钟" : "约 6 分钟") + "</span></div>";

    var el = document.createElement("article");
    el.className = "card";
    el.setAttribute("data-od-id", "topic-post-" + p.title.slice(0, 4));
    el.innerHTML =
      '<div class="card-body">' + meta +
      '<h3 class="card-title"><a href="zd-post.html">' + p.title + "</a></h3>" +
      '<p class="card-excerpt">' + p.excerpt + "</p>" +
      '<div class="card-footer">' +
        '<span class="avatar-sm ' + p.av + '" role="img" aria-label="' + p.author + '">' + p.ch + "</span>" +
        '<a class="author" href="' + authorHref(p.author) + '">' + p.author + "</a>" +
        (p.role ? '<span class="author-role">' + p.role + "</span>" : "") +
        '<span class="dot">·</span><time>' + p.time + "</time>" +
        '<span class="spacer"></span>' +
        '<span class="stat"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>' + p.views + "</span>" +
        '<button class="like-btn" type="button" data-count="' + p.likes + '" aria-label="点赞,当前 ' + p.likes + '">' +
          '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.3 7.7 3.6 4.5 7 4.5c2 0 3.6 1 5 2.9 1.4-1.9 3-2.9 5-2.9 3.4 0 5.7 3.2 4.3 6.8C19.5 15.9 12 20.5 12 20.5Z"/></svg>' +
          '<span class="like-num">' + fmtLike(p.likes) + "</span>" +
        "</button>" +
      "</div></div>";
    return el;
  }

  function renderFeed(sort) {
    var box = document.getElementById("topic-feed");
    box.innerHTML = "";
    var posts = topic.posts;
    if (sort === "hot") {
      posts = posts.slice().sort(function (a, b) { return (b.likes | 0) - (a.likes | 0); });
    } else if (sort === "discuss") {
      posts = posts.slice().sort(function (a, b) { return (b.views.slice ? parseInt(b.views) : 0) - (a.views.slice ? parseInt(a.views) : 0); });
    }
    posts.forEach(function (p) { box.appendChild(renderPost(p)); });
  }

  function renderRelated() {
    var box = document.getElementById("related-list");
    box.innerHTML = "";
    topic.related.forEach(function (t, i) {
      var a = document.createElement("a");
      a.className = "topic";
      a.href = "zd-topic.html?t=" + encodeURIComponent(t);
      a.setAttribute("data-od-id", "related-topic-" + t);
      a.innerHTML = '<span class="topic-rank">0' + (i + 1) + "</span><span class=\"topic-name\">" + t + "</span>";
      box.appendChild(a);
    });
  }

  function apply() {
    document.title = "#" + tName + " · 话题 · zd";
    document.getElementById("tp-name").textContent = tName;
    document.getElementById("tp-desc").textContent = topic.desc;
    document.getElementById("tp-discuss").textContent = topic.discuss + " 讨论";
    document.getElementById("tp-followers").textContent = topic.followers + " 人关注";
    document.getElementById("tp-editor").textContent = topic.editor;
    document.getElementById("tp-rule").textContent = topic.rule;
    var fb = document.getElementById("tp-follow");
    if (topic.followed) { fb.classList.add("is-followed"); fb.textContent = "已关注"; }
    renderFeed("latest");
    renderRelated();
  }
  apply();

  /* 排序 */
  var sortTabs = Array.prototype.slice.call(document.querySelectorAll(".srtab"));
  sortTabs.forEach(function (t) {
    t.addEventListener("click", function () {
      sortTabs.forEach(function (x) { x.classList.toggle("is-active", x === t); });
      renderFeed(t.dataset.sort);
    });
  });

  /* 整卡可点 */
  document.getElementById("topic-feed").addEventListener("click", function (e) {
    if (e.target.closest("a, button")) return;
    var card = e.target.closest(".card");
    if (card) location.href = "zd-post.html";
  });

  /* 关注话题 */
  var followBtn = document.getElementById("tp-follow");
  followBtn.addEventListener("click", function () {
    var on = followBtn.classList.toggle("is-followed");
    followBtn.textContent = on ? "已关注" : "关注话题";
  });

  /* 发帖 → 工作台 */
  document.querySelector('[data-od-id="topic-post"]').addEventListener("click", function () {
    location.href = "zd-create.html";
  });

  /* 点赞 */
  Array.prototype.slice.call(document.querySelectorAll(".like-btn")).forEach(function (btn) {
    btn.addEventListener("click", function () {
      var liked = btn.classList.toggle("is-liked");
      var num = btn.querySelector(".like-num");
      var v = parseInt(btn.dataset.count, 10) || 0;
      btn.dataset.count = liked ? v + 1 : v - 1;
      num.textContent = fmt(parseInt(btn.dataset.count, 10));
    });
  });

  /* ⌘K 聚焦搜索 */
  var searchInput = document.getElementById("search-input");
  document.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
      e.preventDefault();
      if (searchInput) searchInput.focus();
    }
  });

  /* 通知浮窗 */
  var bellBtn = document.getElementById("bell-btn");
  var notifPop = document.getElementById("notif-pop");
  function setNotif(open) {
    if (!bellBtn || !notifPop) return;
    bellBtn.classList.toggle("is-open", open);
    notifPop.classList.toggle("is-open", open);
    bellBtn.setAttribute("aria-expanded", open ? "true" : "false");
  }
  if (bellBtn && notifPop) {
    bellBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      setNotif(bellBtn.getAttribute("aria-expanded") !== "true");
    });
    document.addEventListener("click", function (e) {
      if (bellBtn.getAttribute("aria-expanded") === "true" && !e.target.closest(".notif-wrap")) setNotif(false);
    });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") setNotif(false); });
  }
  var readAll = document.getElementById("notif-readall");
  if (readAll) {
    readAll.addEventListener("click", function () {
      var dot = document.getElementById("bell-dot");
      if (dot) dot.style.display = "none";
      Array.prototype.slice.call(document.querySelectorAll(".notif-item.is-unread")).forEach(function (item) {
        item.classList.remove("is-unread");
      });
      bellBtn.setAttribute("aria-label", "通知");
    });
  }
})();
</script>
