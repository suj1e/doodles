<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>zd · AI 写作工作台</title>
<style>
/* ============================================================
   zd AI 写作工作台 — 左侧 AI 对话 + 右侧文档
   设计系统:shadcn 风格 — 极简中性、黑白主色、克制的留白与描边
   ============================================================ */

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }

:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-warm: var(--surface);
  --fg: #111827;
  --fg-2: var(--fg);
  --muted: #64748b;
  --meta: var(--muted);
  --border: #e5e7eb;
  --border-soft: var(--border);
  --accent: #000000;
  --accent-on: #ffffff;
  --accent-hover: color-mix(in oklab, var(--accent), white 10%);
  --accent-active: color-mix(in oklab, var(--accent), white 18%);
  --success: #16a34a;
  --warn: #d97706;
  --danger: #dc2626;
  --font-display: "Geist", "Geist Sans", -apple-system, system-ui, "Segoe UI", Arial, sans-serif;
  --font-body: "Geist", "Geist Sans", -apple-system, system-ui, "Segoe UI", Arial, sans-serif;
  --font-mono: "Fira Code", ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Monaco, Consolas, monospace;
  --text-xs: 12px;
  --text-sm: 14px;
  --text-base: 16px;
  --text-lg: 20px;
  --text-xl: 24px;
  --text-2xl: 32px;
  --text-3xl: 40px;
  --text-4xl: 48px;
  --leading-body: 1.5;
  --leading-tight: 1.2;
  --tracking-display: -0.02em;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;
  --section-y-desktop: 96px;
  --section-y-tablet: 64px;
  --section-y-phone: 48px;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-pill: 9999px;
  --elev-flat: none;
  --elev-ring: 0 0 0 1px var(--border);
  --elev-raised:
    0 1px 2px 0 color-mix(in oklab, var(--fg), transparent 92%),
    0 1px 3px 0 color-mix(in oklab, var(--fg), transparent 88%);
  --focus-ring: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
  --motion-fast: 150ms;
  --motion-base: 200ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --container-max: 1280px;
  --container-gutter-desktop: 24px;
  --container-gutter-tablet: 16px;
  --container-gutter-phone: 16px;

  /* ─── 侧栏(与整体一致的纯白对话面板) ──────────────────────────────
   * 严格遵循 shadcn 原则:section 之间不靠背景染色区分,层级来自
   * hairline 描边与极浅投影。侧栏背景与右侧文档、整个页面同为纯白
   * --bg,唯一分隔是 splitter 的 1px 描边 —— 左右视觉完全统一。 */
  --sidebar-bg: var(--bg);
  --sidebar-card: var(--surface);
  --sidebar-hover: color-mix(in oklab, var(--border) 45%, var(--surface));
  --sidebar-divider: var(--border);
  --sidebar-text: var(--fg);
  --sidebar-muted: var(--muted);
  --sidebar-accent: var(--accent);
  --sidebar-active-bg: color-mix(in oklab, var(--accent) 5%, var(--surface));
}

/* ---------- 基础 ---------- */
html, body { height: 100%; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--fg);
  font-size: 15px;
  line-height: var(--leading-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  display: flex; flex-direction: column; overflow: hidden;
}
a { color: inherit; text-decoration: none; }
img, svg { display: block; }
button { font: inherit; border: none; background: none; cursor: pointer; color: inherit; }
textarea, input, select { font: inherit; }
::selection { background: color-mix(in oklab, var(--accent) 12%, var(--surface)); }

a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
  border-radius: var(--radius-sm);
}

.container { max-width: var(--container-max); margin: 0 auto; padding: 0 var(--container-gutter-desktop); }
.icon { width: 16px; height: 16px; flex: none; }

  /* ---------- 顶栏(与首页一致) ---------- */
.site-header {
  flex: none;
  background: color-mix(in oklab, var(--bg) 82%, transparent);
  -webkit-backdrop-filter: blur(14px) saturate(1.4);
  backdrop-filter: blur(14px) saturate(1.4);
  border-bottom: 1px solid var(--border);
  z-index: 50;
}
.header-row { display: flex; align-items: center; gap: 20px; height: 60px; }
.brand { display: flex; align-items: center; gap: 7px; flex: none; }
.brand-mark {
  width: 28px; height: 28px; border-radius: var(--radius-sm);
  display: grid; place-items: center;
  background: var(--accent); color: var(--accent-on);
  font-weight: 700; font-size: 15px;
}
.brand-word { font-size: 21px; font-weight: 800; letter-spacing: var(--tracking-display); color: var(--fg); }

.search { flex: 1; max-width: 420px; margin: 0 auto; position: relative; }
.search input {
  width: 100%; height: 38px; padding: 0 52px 0 38px;
  border: 1px solid var(--border); border-radius: var(--radius-md);
  background: var(--surface); color: var(--fg);
  font-size: var(--text-sm);
  transition: border-color var(--motion-fast) var(--ease-standard), box-shadow var(--motion-fast) var(--ease-standard);
}
.search input::placeholder { color: var(--muted); }
.search input:hover { border-color: var(--fg); }
.search input:focus, .search input:focus-visible {
  outline: none; border-color: var(--accent); box-shadow: var(--focus-ring);
}
.search-icon {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  color: var(--muted); pointer-events: none;
}
.search-kbd {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  font-family: var(--font-mono); font-size: 11px; color: var(--muted);
  background: var(--surface); border: 1px solid var(--border); border-bottom-width: 2px;
  border-radius: var(--radius-sm); padding: 1px 6px; pointer-events: none; white-space: nowrap;
}

.header-actions { display: flex; align-items: center; gap: 14px; flex: none; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 38px; padding: 0 16px; border-radius: var(--radius-md);
  font-size: var(--text-sm); font-weight: 600;
  transition: background-color var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard), box-shadow var(--motion-fast) var(--ease-standard), transform .1s ease;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent); color: var(--accent-on); box-shadow: var(--elev-ring); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:active { background: var(--accent-active); }
.btn-primary:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.btn-secondary {
  color: var(--fg); border: 1px solid var(--border);
  background: color-mix(in oklab, var(--border) 40%, var(--surface));
}
.btn-secondary:hover { background: color-mix(in oklab, var(--border) 70%, var(--surface)); border-color: color-mix(in oklab, var(--fg) 24%, var(--surface)); }
.btn-ghost { color: var(--fg); border: 1px solid var(--border); background: var(--surface); }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); background: color-mix(in oklab, var(--accent) 5%, var(--surface)); }
.btn-primary.is-busy, .btn-primary.is-done { cursor: default; }
.btn-primary.is-done { background: var(--success); color: var(--accent-on); box-shadow: none; }

.avatar {
  width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center;
  color: var(--accent-on); font-size: 13px; font-weight: 700;
  border: 1px solid var(--border);
  transition: transform var(--motion-fast) var(--ease-standard);
}
.avatar:hover { transform: scale(1.05); }

.header-login {
  display: inline-flex; align-items: center;
  height: 38px; padding: 0 14px;
  border-radius: var(--radius-md);
  font-size: var(--text-sm); font-weight: 600;
  color: var(--muted);
  border: 1px solid var(--border);
  background: var(--surface);
  transition: color var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), background-color var(--motion-fast) var(--ease-standard);
}
.header-login:hover { color: var(--fg); border-color: var(--fg); }
.header-login:focus-visible { box-shadow: var(--focus-ring); }

.icon-btn {
  position: relative;
  display: grid; place-items: center;
  width: 38px; height: 38px;
  border-radius: var(--radius-md);
  color: var(--fg);
  border: 1px solid var(--border);
  background: var(--surface);
  transition: color var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), background-color var(--motion-fast) var(--ease-standard);
}
.icon-btn:hover { border-color: var(--fg); background: color-mix(in oklab, var(--border) 40%, var(--surface)); }
.mobile-search { display: none; }
.icon-btn:focus-visible { box-shadow: var(--focus-ring); }
.icon-btn .icon { width: 17px; height: 17px; }
.bell-dot {
  position: absolute; top: 7px; right: 8px;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent);
  border: 1.5px solid var(--surface);
}
.icon-btn.is-open { border-color: var(--fg); background: color-mix(in oklab, var(--border) 40%, var(--surface)); }

/* 通知浮窗 */
.notif-wrap { position: relative; }
.notif-pop {
  position: absolute;
  top: calc(100% + 10px);
  right: 0;
  width: 344px;
  max-width: calc(100vw - 32px);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--elev-raised);
  z-index: 60;
  opacity: 0;
  visibility: hidden;
  transform: translateY(-4px);
  transition: opacity var(--motion-base) var(--ease-standard), transform var(--motion-base) var(--ease-standard), visibility 0s linear var(--motion-base);
}
.notif-pop.is-open {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
  transition: opacity var(--motion-base) var(--ease-standard), transform var(--motion-base) var(--ease-standard);
}
.notif-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--border);
}
.notif-head h3 { font-size: var(--text-base); font-weight: 600; color: var(--fg); }
.notif-readall {
  font-size: var(--text-xs); color: var(--muted);
  border: 0; background: none; padding: 4px 6px; border-radius: var(--radius-sm);
  cursor: pointer;
  transition: color var(--motion-fast) var(--ease-standard);
}
.notif-readall:hover { color: var(--fg); }
.notif-readall:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.notif-list { padding: 4px 0; max-height: 300px; overflow-y: auto; }
.notif-item {
  display: flex; gap: 10px;
  padding: 11px 16px;
  position: relative;
}
.notif-item + .notif-item { border-top: 1px solid var(--border-soft); }
.notif-item.is-unread { background: color-mix(in oklab, var(--border) 26%, var(--surface)); }
.notif-item:hover { background: color-mix(in oklab, var(--border) 40%, var(--surface)); }
.notif-item .icon { width: 16px; height: 16px; flex: none; margin-top: 2px; color: var(--muted); }
.notif-item.is-unread .icon { color: var(--accent); }
.notif-body { min-width: 0; }
.notif-text { font-size: var(--text-sm); line-height: var(--leading-body); color: var(--fg); }
.notif-text strong { font-weight: 600; }
.notif-text em { font-style: normal; color: var(--muted); }
.notif-time { display: block; margin-top: 3px; font-size: var(--text-xs); color: var(--muted); }
.notif-unread-dot {
  position: absolute; left: 8px; top: 16px;
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent);
}
.notif-foot {
  padding: 10px 16px 14px;
  border-top: 1px solid var(--border);
  text-align: center;
}
.notif-foot a {
  display: inline-block;
  font-size: var(--text-sm); font-weight: 500; color: var(--fg);
  padding: 6px 12px; border-radius: var(--radius-sm);
  transition: background-color var(--motion-fast) var(--ease-standard);
}
.notif-foot a:hover { background: color-mix(in oklab, var(--border) 50%, var(--surface)); }
.notif-foot a:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.avatar-g1 { background: linear-gradient(135deg, oklch(46% 0.01 250), oklch(35% 0.01 250)); }


/* ---------- 工作台布局 ---------- */
.workbench {
  flex: 1; min-height: 0;
  display: flex;
}

/* ---------- 侧栏(暗色对话面板) ---------- */
.sidebar {
  flex: none; width: 300px;
  display: flex; flex-direction: column; min-height: 0;
  background: var(--sidebar-bg);
  position: relative;
}
/* 中间 splitter:可拖拽调整左右面板宽度 */
.splitter {
  flex: none; width: 6px; cursor: col-resize;
  background: transparent; position: relative; z-index: 5;
}
.splitter::before {
  content: ""; position: absolute; top: 0; bottom: 0; left: 50%;
  transform: translateX(-50%); width: 1px;
  background: var(--border);
  transition: background-color var(--motion-fast) var(--ease-standard), width var(--motion-fast) var(--ease-standard);
}
.splitter:hover::before, .splitter.is-dragging::before {
  background: var(--accent); width: 2px;
}
.sidebar-head {
  flex: none;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; height: 56px;
  border-bottom: 1px solid var(--sidebar-divider);
}
.sidebar-brand {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--font-mono); font-size: 13px; font-weight: 700;
  color: var(--sidebar-text); letter-spacing: .03em;
}
.sidebar-brand .icon { width: 16px; height: 16px; color: var(--sidebar-accent); }
.sidebar-new {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; border-radius: var(--radius-sm);
  color: var(--sidebar-muted); border: 1px solid var(--sidebar-divider);
  background: transparent;
  transition: color var(--motion-fast) var(--ease-standard), background-color var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard);
}
.sidebar-new:hover { color: var(--sidebar-text); background: var(--sidebar-hover); border-color: var(--sidebar-muted); }
.sidebar-new:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--sidebar-bg), 0 0 0 4px var(--sidebar-accent); }
.sidebar-new .icon { width: 15px; height: 15px; }

/* 对话记录(消息日志) */
.conv-list {
  flex: 1; min-height: 0; overflow-y: auto; padding: 10px 8px;
  display: flex; flex-direction: column; gap: 8px;
}

/* 回到最新:上滑离开底部时,出现在待办卡片上方、居中 */
.jump-latest {
  flex: none; align-self: center;
  z-index: 8;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px;
  font-size: var(--text-sm); font-weight: 500; color: var(--sidebar-text);
  background: var(--sidebar-card);
  border: 1px solid var(--sidebar-divider);
  border-radius: var(--radius-pill);
  box-shadow: var(--elev-raised);
  cursor: pointer;
  opacity: 0; transform: translateY(6px); pointer-events: none;
  transition: opacity var(--motion-fast) var(--ease-standard), transform var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard);
}
.jump-latest.is-shown { opacity: 1; transform: translateY(0); pointer-events: auto; }
.jump-latest:not(.is-shown) { height: 0; padding: 0 12px; margin: 0; border-width: 0; box-shadow: none; overflow: hidden; }
.jump-latest:hover { border-color: var(--sidebar-muted); }
.jump-latest:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.jump-latest .icon { width: 14px; height: 14px; color: var(--sidebar-muted); }
.jump-latest.is-new .icon { color: var(--accent); }
.jump-latest.is-new::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }

/* 待办卡片(独立区块,可折叠) */
.todo-section {
  flex: none; margin: 8px 12px 4px;
  background: var(--sidebar-card);
  border: 1px solid var(--sidebar-divider);
  border-radius: var(--radius-md);
  box-shadow: var(--elev-ring);
  overflow: hidden;
}
.todo-head {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 10px 12px;
  background: none; border: none; cursor: pointer; text-align: left;
  -webkit-appearance: none; font-family: inherit;
  transition: background-color var(--motion-fast) var(--ease-standard);
}
.todo-head:hover { background: var(--sidebar-hover); }
.todo-head:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: var(--radius-md); }
.todo-head .icon { flex: none; width: 13px; height: 13px; color: var(--warn); }
.todo-title {
  font-size: var(--text-sm); font-weight: 600; color: var(--sidebar-text);
  letter-spacing: .01em;
}
.todo-count {
  flex: none; min-width: 18px; height: 18px; padding: 0 5px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: var(--sidebar-text);
  background: var(--sidebar-hover); border-radius: var(--radius-pill);
}
.todo-head .chevron {
  flex: none; width: 13px; height: 13px; margin-left: auto;
  color: var(--sidebar-muted);
  transition: transform var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
}
.todo-section.collapsed .todo-head .chevron { transform: rotate(-90deg); }
.todo-head:hover .chevron { color: var(--sidebar-text); }
.todo-list {
  display: flex; flex-direction: column; gap: 2px;
  max-height: 190px; opacity: 1;
  overflow: hidden; pointer-events: auto;
  padding: 2px 8px 8px; border-top: 1px solid var(--sidebar-divider);
  transition: max-height var(--motion-fast) var(--ease-standard), opacity var(--motion-fast) var(--ease-standard);
}
.todo-section.collapsed .todo-list { max-height: 0; opacity: 0; pointer-events: none; border-top-color: transparent; }
.todo-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 6px; border-radius: var(--radius-sm);
  font-size: var(--text-sm); color: var(--sidebar-text);
  cursor: pointer;
  transition: background-color var(--motion-fast) var(--ease-standard);
}
.todo-item:hover { background: var(--sidebar-hover); }
.todo-check {
  flex: none; width: 16px; height: 16px; border-radius: 4px;
  border: 1.5px solid var(--sidebar-muted); display: grid; place-items: center;
  transition: background-color var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard);
}
.todo-item:hover .todo-check { border-color: var(--sidebar-accent); }
.todo-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.todo-tag {
  flex: none; font-size: 10px; font-weight: 600; color: var(--warn);
  background: color-mix(in oklab, var(--warn) 15%, var(--sidebar-card));
  padding: 2px 6px; border-radius: var(--radius-pill);
}
.todo-item.is-done .todo-check { border-color: var(--success); background: color-mix(in oklab, var(--success) 22%, var(--sidebar-card)); }
.todo-item.is-done .todo-check .icon { color: var(--success); }
.todo-item.is-done .todo-text { color: var(--sidebar-muted); text-decoration: line-through; text-decoration-thickness: 1px; text-decoration-color: color-mix(in oklab, var(--sidebar-muted) 60%, transparent); }

/* 侧栏输入框(独立块区) */
.sb-composer {
  flex: none; margin: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--elev-raised);
  padding: 10px 10px 8px;
  transition: border-color var(--motion-fast) var(--ease-standard), box-shadow var(--motion-fast) var(--ease-standard);
}
.sb-composer:focus-within { border-color: var(--accent); box-shadow: var(--focus-ring); }
.sb-composer textarea {
  display: block; width: 100%; min-height: 40px; max-height: 120px; resize: none;
  border: none; outline: none; background: transparent; color: var(--fg);
  font-family: var(--font-body); font-size: var(--text-sm); line-height: 1.55;
}
.sb-composer textarea::placeholder { color: var(--muted); }
.sb-tools {
  display: flex; align-items: center; gap: 6px;
  margin-top: 8px; padding-top: 8px;
  border-top: 1px solid var(--border-soft);
}
.sb-icon-btn {
  flex: none; width: 30px; height: 30px; border-radius: var(--radius-sm);
  display: grid; place-items: center; color: var(--sidebar-muted);
  border: 1px solid transparent; background: transparent;
  transition: color var(--motion-fast) var(--ease-standard), background-color var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard);
}
.sb-icon-btn:hover { color: var(--sidebar-text); background: var(--sidebar-hover); border-color: var(--sidebar-divider); }
.sb-icon-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--sidebar-bg), 0 0 0 4px var(--sidebar-accent); }
.sb-icon-btn .icon { width: 15px; height: 15px; }
.sb-send {
  flex: none; width: 30px; height: 30px; border-radius: var(--radius-sm);
  display: grid; place-items: center; margin-left: auto;
  background: var(--sidebar-accent); color: var(--sidebar-bg);
  transition: background-color var(--motion-fast) var(--ease-standard);
}
.sb-send:hover { background: color-mix(in oklab, var(--sidebar-accent), var(--sidebar-bg) 15%); }
.sb-send:active { background: color-mix(in oklab, var(--sidebar-accent), var(--sidebar-bg) 25%); }
.sb-send:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.sb-send .icon { width: 14px; height: 14px; }
.sb-send:disabled, .sb-composer textarea:disabled { opacity: .45; cursor: default; }
.sb-send:disabled:hover { background: var(--sidebar-accent); }
.sb-model {
  flex: none; display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 8px; border-radius: var(--radius-pill);
  font-size: 11px; font-weight: 600; color: var(--sidebar-muted);
  background: var(--sidebar-card); border: 1px solid var(--sidebar-divider);
  cursor: pointer; white-space: nowrap;
  transition: color var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), background-color var(--motion-fast) var(--ease-standard);
}
.sb-model:hover { color: var(--sidebar-text); border-color: var(--sidebar-muted); }
.sb-model .icon { width: 10px; height: 10px; }
.sb-mode {
  flex: none; display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 8px; border-radius: var(--radius-pill);
  font-size: 11px; font-weight: 600; color: var(--sidebar-muted);
  border: 1px solid var(--sidebar-divider); cursor: pointer; white-space: nowrap;
  transition: color var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), background-color var(--motion-fast) var(--ease-standard);
}
.sb-mode:hover { color: var(--sidebar-text); border-color: var(--sidebar-muted); }
.sb-mode .icon { width: 10px; height: 10px; }

/* 用户信息 */
.sidebar-user {
  flex: none; display: flex; align-items: center; gap: 8px;
  padding: 10px 14px; border-top: 1px solid var(--sidebar-divider);
}
.sidebar-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: color-mix(in oklab, var(--sidebar-accent) 18%, var(--sidebar-bg));
  border: 1px solid var(--sidebar-divider);
  display: grid; place-items: center;
  font-size: 12px; font-weight: 700; color: var(--sidebar-accent); flex: none;
}
.sidebar-user-info { flex: 1; min-width: 0; }
.sidebar-user-name { font-size: var(--text-sm); font-weight: 600; color: var(--sidebar-text); }
.sidebar-user-plan { font-size: 11px; color: var(--sidebar-muted); }
.sidebar-user-btn {
  flex: none; width: 26px; height: 26px; border-radius: var(--radius-sm);
  display: grid; place-items: center; color: var(--sidebar-muted);
  transition: color var(--motion-fast) var(--ease-standard), background-color var(--motion-fast) var(--ease-standard);
}
.sidebar-user-btn:hover { color: var(--sidebar-text); background: var(--sidebar-hover); }
.sidebar-user-btn .icon { width: 13px; height: 13px; }

/* ---------- 左:对话记录(左右气泡聊天) ---------- */
.log-sys {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  color: var(--sidebar-muted); font-size: 11px;
  font-family: var(--font-mono);
  padding: 2px 0;
}
.log-user {
  align-self: flex-end;
  max-width: 88%;
  display: flex; align-items: baseline; gap: 9px;
  color: var(--sidebar-text);
  white-space: pre-wrap; word-break: break-word;
  font-weight: 500; font-size: var(--text-sm); line-height: 1.5;
  padding: 9px 12px;
  background: color-mix(in oklab, var(--border) 38%, var(--surface));
  border: 1px solid var(--sidebar-divider);
  border-radius: var(--radius-md) var(--radius-md) var(--radius-sm) var(--radius-md);
}
.log-time {
  margin-left: auto; flex: none;
  font-size: 10px; color: var(--sidebar-muted);
  font-variant-numeric: tabular-nums;
}
.log-ai {
  align-self: flex-start;
  max-width: 88%;
  background: var(--surface);
  border: 1px solid var(--sidebar-divider);
  border-radius: var(--radius-md) var(--radius-md) var(--radius-md) var(--radius-sm);
  padding: 10px 12px;
}
.ai-meta {
  display: flex; align-items: baseline; gap: 8px;
  margin-bottom: 7px;
  font-family: var(--font-mono); font-size: 10px; color: var(--sidebar-muted);
}
.ai-meta .ai-role {
  flex: none; font-weight: 700; color: var(--sidebar-accent);
  background: color-mix(in oklab, var(--sidebar-accent) 14%, var(--sidebar-bg));
  border: 1px solid var(--sidebar-divider);
  padding: 1px 6px; border-radius: var(--radius-pill); font-size: 9px;
}
.ai-meta .ai-file { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log-ai .ai-body {
  font-family: var(--font-body);
  font-size: var(--text-sm); color: var(--sidebar-text);
  white-space: pre-wrap; word-break: break-word;
  line-height: 1.6;
}
.ai-acts { display: flex; justify-content: flex-end; gap: 6px; margin-top: 9px; }
.ai-acts .btn { height: 26px; padding: 0 10px; font-size: 11px; font-family: var(--font-mono); }
.ai-acts .btn-ghost { background: transparent; color: var(--sidebar-muted); border-color: var(--sidebar-divider); }
.ai-acts .btn-ghost:hover { color: var(--sidebar-text); border-color: var(--sidebar-muted); }
.ai-acts .btn-primary { background: var(--sidebar-accent); color: var(--sidebar-bg); border: 1px solid var(--sidebar-accent); }
.ai-acts .btn-primary:hover { background: color-mix(in oklab, var(--sidebar-accent), var(--sidebar-bg) 18%); }
.log-ai .ai-ok {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 8px;
  font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: var(--success);
}
.log-ai .ai-ok .icon { width: 12px; height: 12px; }
.log-pending { color: var(--sidebar-muted); display: flex; align-items: center; gap: 9px; font-size: var(--text-sm); }
.log-pending .spinner { animation: spin .9s linear infinite; display: inline-flex; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- 右:文档 ---------- */
.doc-pane {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column; min-height: 0;
  background: var(--bg);
}
.doc-toolbar {
  flex: none;
  display: flex; align-items: center; gap: 2px;
  padding: 8px 18px;
  border-bottom: 1px solid var(--border);
  overflow-x: auto; scrollbar-width: none;
}
.doc-toolbar::-webkit-scrollbar { display: none; }
.tool-btn {
  flex: none; width: 32px; height: 32px;
  display: grid; place-items: center;
  border-radius: var(--radius-sm);
  color: var(--muted);
  transition: color var(--motion-fast) var(--ease-standard), background-color var(--motion-fast) var(--ease-standard);
}
.tool-btn:hover { color: var(--fg); background: color-mix(in oklab, var(--border) 40%, var(--surface)); }
.tool-btn:focus-visible { box-shadow: var(--focus-ring); }
.tool-btn .icon { width: 15px; height: 15px; }
.tool-sep { width: 1px; height: 18px; background: var(--border); margin: 0 6px; flex: none; }
.tool-hint { margin-left: auto; font-size: var(--text-xs); color: var(--muted); white-space: nowrap; }

.doc-scroll { flex: 1; min-height: 0; overflow-y: auto; }
.title-input {
  display: block; width: 100%;
  border: none; outline: none; resize: none;
  background: transparent; color: var(--fg);
  font-family: var(--font-display);
  font-size: clamp(22px, 3.2vw, 28px);
  font-weight: 800; line-height: 1.35;
  letter-spacing: var(--tracking-display);
  padding: 24px 26px 10px;
}
.title-input::placeholder { color: color-mix(in oklab, var(--muted) 55%, var(--surface)); }

.content-input {
  display: block; width: 100%;
  border: none; outline: none; resize: none;
  background: transparent; color: var(--fg);
  font-size: var(--text-base); line-height: 1.85;
  padding: 8px 26px 28px;
  min-height: 420px;
  border-radius: var(--radius-md);
  transition: box-shadow var(--motion-base) var(--ease-standard);
}
.content-input::placeholder { color: color-mix(in oklab, var(--muted) 55%, var(--surface)); }
.content-input.flash { animation: ringflash 1.3s var(--ease-standard); }
@keyframes ringflash {
  0% { box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 28%, transparent); }
  100% { box-shadow: 0 0 0 0 transparent; }
}

.doc-foot {
  flex: none;
  display: flex; align-items: center; gap: 16px;
  padding: 10px 26px;
  border-top: 1px solid var(--border);
  font-size: var(--text-xs); color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.doc-foot .save-state { display: inline-flex; align-items: center; gap: 6px; }
.doc-foot .save-state .icon { width: 13px; height: 13px; color: var(--success); }
.doc-foot .drafts-link {
  display: inline-flex; align-items: center; gap: 6px;
  margin-left: 16px;
  font-size: var(--text-sm); font-weight: 600;
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 6px 12px;
  transition: color var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard);
}
.doc-foot .drafts-link .icon { width: 14px; height: 14px; }
.doc-foot .drafts-link:hover { color: var(--fg); border-color: var(--fg); }
.doc-foot .drafts-link:focus-visible { box-shadow: var(--focus-ring); }
.doc-foot .spacer { flex: 1; }
.doc-foot .publish-mini {
  display: inline-flex; align-items: center; gap: 6px;
  height: 30px; padding: 0 12px;
  background: var(--accent); color: var(--accent-on);
  border-radius: var(--radius-sm); font-size: var(--text-xs); font-weight: 600;
  transition: background-color var(--motion-fast) var(--ease-standard);
}
.doc-foot .publish-mini:hover { background: var(--accent-hover); }
.doc-foot .publish-mini .icon { width: 13px; height: 13px; }

/* ---------- 移动端切换 Tab ---------- */
.mode-tabs { display: none; }

/* Toast */
.toast {
  position: fixed; left: 50%; bottom: 28px;
  transform: translate(-50%, 20px);
  opacity: 0; pointer-events: none;
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--fg); color: var(--bg);
  font-size: var(--text-sm); font-weight: 600;
  padding: 10px 18px; border-radius: var(--radius-md);
  box-shadow: var(--elev-raised);
  transition: opacity var(--motion-base) var(--ease-standard), transform var(--motion-base) var(--ease-standard);
  z-index: 100;
}
.toast.is-show { opacity: 1; transform: translate(-50%, 0); }
.toast .icon { color: var(--success); }

/* ---------- 响应式 ---------- */
@media (max-width: 1020px) {
  .sidebar { width: 260px; }
}
@media (max-width: 760px) {
  body { overflow: auto; }
  .container { padding: 0 var(--container-gutter-phone); }
  .notif-pop { position: fixed; top: 66px; right: 12px; width: min(344px, calc(100vw - 24px)); }
  .search { display: none; }
  .mobile-search { display: grid; }
  .header-actions { margin-left: auto; }
  .brand-word { font-size: 19px; }

  .workbench { flex-direction: column; }
  .mode-tabs {
    flex: none; display: flex;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .mode-tab {
    flex: 1; height: 46px;
    font-size: var(--text-sm); font-weight: 600; color: var(--muted);
    border-bottom: 2px solid transparent;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: color var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard);
  }
  .mode-tab .icon { width: 15px; height: 15px; }
  .mode-tab.is-on { color: var(--fg); border-bottom-color: var(--accent); }
  .sidebar {
    width: 100%; border-right: none;
    display: none;
  }
  .splitter { display: none; }
  .doc-pane {
    width: 100%; border-right: none;
    display: none;
  }
  .sidebar.is-on, .doc-pane.is-on { display: flex; }
  .sidebar, .doc-pane {
    height: calc(100dvh - 60px - 48px - 46px);
  }
  .content-input { min-height: 60vh; }
  .tool-hint { display: none; }
}
</style>
</head>

      <button class="tool-btn" type="button" title="斜体" aria-label="斜体"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M19 4h-9M14 20H5M15 4L9 20"/></svg></button>
      <button class="tool-btn" type="button" title="引用" aria-label="引用"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 11V7H5v6h5v4M21 11V7h-5v6h5v4"/></svg></button>

第一个要说的是《路标》,两个人聊产品,也聊做产品的这代人。不是那种成功学,更像是隔着屏幕听老同事复盘,很多「当时要是早知道」的踩坑,都被他们提前讲出来了。声音很稳,适合早上还没完全醒的状态。

如果你的通勤路比较长,那《深潜》会是个好选择——每期一个半小时起步,主题从深海工程到电竞俱乐部,制作质感在中文播客里算得上头部。地铁上戴着降噪耳机,一集听下来正好到站。</textarea>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var titleInput = $("title-input");
  var contentInput = $("content-input");
  var charCount = $("char-count");
  var logEl = $("conv-list");
  var toast = $("toast");
  var cliInput = $("sb-input");
  var sendBtn = $("sb-send");
  var jumpLatest = $("jump-latest");

  var AI_ICON = '<svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c.5 3.7 3 6.2 6.7 6.7-3.7.5-6.2 3-6.7 6.7C11.5 11.7 9 9.2 5.3 8.7 9 8.2 11.5 5.7 12 2Z"/><path d="M19 14c.3 1.9 1.6 3.2 3.5 3.5-1.9.3-3.2 1.6-3.5 3.5-.3-1.9-1.6-3.2-3.5-3.5 1.9-.3 3.2-1.6 3.5-3.5Z"/></svg>';
  var OK_ICON = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';

  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  /* ---------- 素材池(演示数据,标注为示例生成) ---------- */
  var P1_POOL = [
    "上班通勤的这四十分钟,以前是刷手机打发,现在是雷打不动的听播客时间。坚持了快两年,我的「下饭节目」换过几轮,但下面这六档,是无论如何都舍不得删的。",
    "上班通勤这四十分钟,以前用来刷手机,现在雷打不动地听播客。坚持快两年,「下饭节目」换了一轮又一轮,但这六档,始终舍不得删。",
    "通勤的四十分钟,从刷手机到听播客,我换了不下五种打发方式,最后留下来的只有播客。坚持快两年,节目单迭代了好几次,可这六档,删谁都不行。"
  ];
  var CONT_POOL = [
    "再往下,想单独说说我私藏的三档独立小播客——制作也许没那么精致,但胜在真诚。《失眠俱乐部》是我夜班回家路上的治愈;《代码之外》每期请一位非典型工程师聊跨界;《慢谈》则只聊书和电影。它们的共同点是:不赶热点,只做自己真正想聊的内容。",
    "最后分享一点挑播客的心得:别只追「大家都在听」的热榜。通勤播客要匹配的,是你那段通勤的心情——早起听轻松的,加班夜换成深度的。把这四十分钟真正留给自己,比什么都重要。"
  ];
  var TITLES = [
    "通勤两小时,我靠这六档播客续命",
    "收藏夹里最舍不得删的 6 档中文播客",
    "把通勤变成一天里最放松的时刻"
  ];
  var SUMMARY = "作者分享了坚持两年通勤听播客攒下的六档舍不得删的节目:从老友式的产品复盘,到制作精良的深度专题,最后给出按通勤场景挑播客的方法,把通勤时间真正变成属于自己的放松时刻。";

  var P1_STEP = 0, CONT_STEP = 0, TI_STEP = 0;

  /* ---------- 控制台日志 ---------- */
  var messages = [];
  var busy = false;
  var msgSeq = 0;
  var nearBottom = true;

  function logScroll() {
    logEl.scrollTop = logEl.scrollHeight;
    nearBottom = true;
    updateJump();
  }

  function isNearBottom() {
    return logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 80;
  }

  function updateJump() {
    if (!jumpLatest) return;
    jumpLatest.classList.toggle("is-shown", !isNearBottom());
  }

  logEl.addEventListener("scroll", function () {
    nearBottom = isNearBottom();
    updateJump();
  }, { passive: true });

  if (jumpLatest) {
    jumpLatest.addEventListener("click", function () {
      jumpLatest.classList.remove("is-new");
      logScroll();
      logEl.focus();
    });
  }

  function render() {
    logEl.innerHTML = "";
    messages.forEach(function (m) {
      if (m.type === "sys") {
        var s = document.createElement("div");
        s.className = "log-sys";
        s.innerHTML = '<span>' + esc(m.text) + '</span><span class="log-time">' + (m.time || stamp()) + '</span>';
        logEl.appendChild(s);
      } else if (m.type === "user") {
        var u = document.createElement("div");
        u.className = "log-user";
        var t = document.createElement("span");
        t.textContent = m.text;
        var tm = document.createElement("span");
        tm.className = "log-time";
        tm.textContent = m.time || stamp();
        u.appendChild(t); u.appendChild(tm);
        logEl.appendChild(u);
      } else if (m.type === "ai") {
        var a = document.createElement("div");
        a.className = "log-ai";
        a.dataset.id = m.id;
        var acts = m.applied
          ? ''
          : '<div class="ai-acts">' +
            '<button class="btn btn-ghost" type="button" data-act="dismiss">忽略</button>' +
            '<button class="btn btn-ghost" type="button" data-act="regenerate">重新生成</button>' +
            '<button class="btn btn-primary" type="button" data-act="apply">应用</button>' +
            '</div>';
        a.innerHTML =
          '<div class="ai-meta"><span class="ai-role">AI</span><span class="ai-file">' + esc(m.file) + '</span><span class="log-time">' + (m.time || stamp()) + '</span></div>' +
          '<div class="ai-body">' + esc(m.text) + '</div>' +
          acts +
          (m.applied ? '<div class="ai-ok">' + OK_ICON + esc(m.ok || "已应用到文档") + '</div>' : '');
        logEl.appendChild(a);
      }
    });
    if (isNearBottom()) {
      logScroll();
    } else if (jumpLatest) {
      jumpLatest.classList.add("is-new");
      updateJump();
    }
  }

  function pushSys(t) { messages.push({ type: "sys", text: t, time: stamp() }); render(); }
  function pushUser(t) { messages.push({ type: "user", text: t, time: stamp() }); render(); }

  function pushAI(file, text, id) {
    messages.push({ type: "ai", id: id, file: file, text: text, applied: false, time: stamp() });
    render();
    persistLog();
    return id;
  }

  function markApplied(id, okText) {
    messages.forEach(function (m) {
      if (m.type === "ai" && m.id === id) { m.applied = true; m.ok = okText || "已应用到文档"; }
    });
    render();
  }

  function setBusy(on) {
    busy = on;
    if (sendBtn) sendBtn.disabled = on;
    if (cliInput) cliInput.disabled = on;
  }

  /* ---------- 文档操作 ---------- */
  function splitParas(t) { return t.split(/\n\s*\n/).map(function (s) { return s.trim(); }).filter(Boolean); }
  function joinParas(arr) { return arr.join("\n\n"); }

  function replaceFirstPara(text) {
    var paras = splitParas(text);
    var nv = P1_POOL[P1_STEP % P1_POOL.length];
    P1_STEP++;
    paras[0] = nv;
    return joinParas(paras);
  }

  function appendContinuation(text) {
    var c = CONT_POOL[CONT_STEP % CONT_POOL.length];
    CONT_STEP++;
    return text.replace(/\s+$/, "") + "\n\n" + c;
  }

  function flashDoc() {
    contentInput.classList.remove("flash");
    void contentInput.offsetWidth;
    contentInput.classList.add("flash");
  }

  function applyToDoc(setTitle) {
    if (setTitle) {
      titleInput.value = setTitle;
    } else {
      flashDoc();
    }
    scheduleSave();
  }

  /* ---------- 字数 ---------- */
  function countWords(t) {
    t = t.trim();
    if (!t) return 0;
    var cjk = (t.match(/[\u4e00-\u9fff\u3000-\u303f\uff00-\uffef]/g) || []).length;
    var other = t.replace(/[\u4e00-\u9fff\u3000-\u303f\uff00-\uffef]/g, " ").trim();
    var words = other ? other.split(/\s+/).length : 0;
    return cjk + words;
  }
  function refreshCount() {
    var n = countWords(contentInput.value);
    var mins = Math.max(1, Math.round(n / 250));
    charCount.textContent = n + " 字 · 约 " + mins + " 分钟读完";
  }
  contentInput.addEventListener("input", refreshCount);
  refreshCount();

  /* ---------- 草稿状态 ---------- */
  function stamp() {
    var d = new Date();
    var hh = ("0" + d.getHours()).slice(-2);
    var mm = ("0" + d.getMinutes()).slice(-2);
    return hh + ":" + mm;
  }
  var saveState = $("save-state");
  var pendingSave = null;
  function scheduleSave() {
    saveState.innerHTML = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>正在保存…';
    clearTimeout(pendingSave);
    pendingSave = setTimeout(function () {
      saveState.innerHTML = OK_ICON + "已保存 " + stamp();
      try {
        localStorage.setItem("zd-draft-title", titleInput.value);
        localStorage.setItem("zd-draft-content", contentInput.value);
      } catch (e) {}
    }, 900);
  }
  titleInput.addEventListener("input", scheduleSave);
  contentInput.addEventListener("input", scheduleSave);

  /* ---------- 日志持久化 ---------- */
  function persistLog() {
    try {
      localStorage.setItem("zd-console-log", JSON.stringify(messages.slice(-30)));
      localStorage.setItem("zd-wb-step", JSON.stringify({ p1: P1_STEP, ct: CONT_STEP, ti: TI_STEP }));
    } catch (e) {}
  }

  /* ---------- 指令路由 ---------- */
  var fileMap = { polish: "正文 · 第 1 段", continue: "正文 · 末尾追加", title: "标题", summary: "摘要" };

  function runAI(kind, id) {
    var file = fileMap[kind] || "正文";
    if (kind === "polish") {
      var nv = P1_POOL[P1_STEP % P1_POOL.length];
      P1_STEP++;
      pushAI(file, "改写后的第一段:\n\n" + nv, id);
    } else if (kind === "continue") {
      var c = CONT_POOL[CONT_STEP % CONT_POOL.length];
      CONT_STEP++;
      pushAI(file, "为你续写的一段:\n\n" + c, id);
    } else if (kind === "title") {
      pushAI(file, "备选标题(示例):\n① " + TITLES[TI_STEP % TITLES.length] + "\n② " + TITLES[(TI_STEP + 1) % TITLES.length] + "\n③ " + TITLES[(TI_STEP + 2) % TITLES.length], id);
      TI_STEP++;
    } else if (kind === "summary") {
      pushAI(file, "一句话摘要(示例):\n" + SUMMARY, id);
    } else {
      pushAI(file, "收到指令,已按你的要求重新组织了表达,可以直接应用到正文。", id);
    }
    return id;
  }

  function handleCommand(raw) {
    raw = raw.trim();
    if (!raw || busy) return;
    cliInput.value = "";
    pushUser(raw);

    var kind = null;
    var first = raw.split(/\s+/)[0];
    if (first === "/润色") kind = "polish";
    else if (first === "/续写") kind = "continue";
    else if (first === "/标题") kind = "title";
    else if (first === "/摘要") kind = "summary";

    var id = ++msgSeq;
    setBusy(true);
    var spin = document.createElement("div");
    spin.className = "log-pending";
    spin.innerHTML = '<span class="spinner">⟳</span>正在处理…';
    logEl.appendChild(spin);
    logScroll();

    setTimeout(function () {
      spin.remove();
      setBusy(false);
      runAI(kind || "custom", id);
    }, 850);
  }

  /* ---------- 应用 / 重新生成 ---------- */
  logEl.addEventListener("click", function (e) {
    var actBtn = e.target.closest("[data-act]");
    if (!actBtn) return;
    var block = actBtn.closest(".log-ai");
    if (!block) return;
    var mid = parseInt(block.dataset.id, 10);
    var msg = null;
    messages.forEach(function (m) { if (m.type === "ai" && m.id === mid) msg = m; });
    if (!msg) return;

    var act = actBtn.dataset.act;
    if (act === "apply") {
      if (msg.file.indexOf("标题") === 0) {
        var t = msg.text.split("\n").map(function (s) { return s.replace(/^[①②③]\s*/, ""); }).filter(Boolean)[0] || "";
        applyToDoc(t);
        markApplied(mid, "已应用新标题");
      } else if (msg.file.indexOf("摘要") === 0) {
        applyToDoc(null);
        markApplied(mid, "已复制到剪贴板(演示)");
      } else {
        if (msg.file.indexOf("末尾") !== -1) {
          contentInput.value = appendContinuation(contentInput.value);
        } else if (msg.file.indexOf("第 1 段") !== -1) {
          contentInput.value = replaceFirstPara(contentInput.value);
        } else {
          contentInput.value = replaceFirstPara(contentInput.value);
        }
        flashDoc();
        scheduleSave();
        refreshCount();
        markApplied(mid, "修改已写入文档");
      }
      showToast("已应用到文档");
    } else if (act === "regenerate") {
      var oldId = mid;
      var kind = msg.file.indexOf("第 1 段") !== -1 ? "polish" : msg.file.indexOf("末尾") !== -1 ? "continue" : msg.file.indexOf("标题") === 0 ? "title" : msg.file.indexOf("摘要") === 0 ? "summary" : "custom";
      messages = messages.filter(function (m) { return !(m.type === "ai" && m.id === oldId); });
      runAI(kind, ++msgSeq);
      persistLog();
    } else if (act === "dismiss") {
      messages = messages.filter(function (m) { return !(m.type === "ai" && m.id === mid); });
      render();
      persistLog();
    }
  });

  /* ---------- 发送 ---------- */
  sendBtn.addEventListener("click", function () { handleCommand(cliInput.value); });
  function autosize() {
    cliInput.style.height = "auto";
    cliInput.style.height = Math.min(cliInput.scrollHeight, 120) + "px";
  }
  cliInput.addEventListener("input", autosize);
  cliInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleCommand(cliInput.value); }
    if (e.key === "Enter" && e.shiftKey) { autosize(); }
  });

  /* ---------- 侧栏:新建对话 / 模型 / 模式 / 附件 ---------- */
  document.querySelector(".sidebar-new").addEventListener("click", function () {
    if (busy) return;
    messages = [];
    pushSys("⟠ 新对话已创建 · 草稿「" + titleInput.value + "」");
    pushSys("输入指令,AI 会把修改直接写入右侧文档");
    persistLog();
    showToast("已新建对话");
  });
  var MODELS = ["GPT-4o", "Claude 4", "DeepSeek-V3", "通义千问"];
  var MODES = ["创作", "讨论", "深度"];
  var mi = 0, mm = 0;
  $("sb-model").addEventListener("click", function () {
    mi = (mi + 1) % MODELS.length;
    this.lastChild.textContent = MODELS[mi];
  });
  $("sb-mode").addEventListener("click", function () {
    mm = (mm + 1) % MODES.length;
    this.lastChild.textContent = MODES[mm];
  });
  $("sb-attach").addEventListener("click", function () { showToast("附件功能(演示)"); });

  /* ---------- 待办 ---------- */
  var todoSection = document.getElementById("todo-section");
  var todoToggle = document.getElementById("todo-toggle");
  var todoCount = document.getElementById("todo-count");
  todoToggle.addEventListener("click", function () {
    var collapsed = todoSection.classList.toggle("collapsed");
    todoToggle.setAttribute("aria-expanded", String(!collapsed));
  });

  function refreshTodoCount() {
    var remaining = document.querySelectorAll(".todo-item:not(.is-done)").length;
    todoCount.textContent = String(remaining);
    todoCount.style.display = remaining > 0 ? "" : "none";
  }
  refreshTodoCount();

  document.querySelectorAll(".todo-item").forEach(function (item) {
    item.addEventListener("click", function () {
      item.classList.toggle("is-done");
      var check = item.querySelector(".todo-check .icon");
      check.style.opacity = item.classList.contains("is-done") ? "1" : "0";
      refreshTodoCount();
    });
  });

  /* ---------- splitter:拖动调整左右面板宽度 ---------- */
  var splitter = document.querySelector(".splitter");
  var sidebarEl = document.querySelector(".sidebar");
  var SIDE_MIN = 240, SIDE_MAX = 480;
  var dragStartX = 0, dragStartW = 0;
  function splitActive() { return !window.matchMedia("(max-width: 760px)").matches; }
  splitter.addEventListener("pointerdown", function (e) {
    if (!splitActive()) return;
    splitter.classList.add("is-dragging");
    splitter.setPointerCapture(e.pointerId);
    dragStartX = e.clientX;
    dragStartW = sidebarEl.getBoundingClientRect().width;
    document.body.style.cursor = "col-resize";
    document.body.style.userSelect = "none";
    e.preventDefault();
  });
  splitter.addEventListener("pointermove", function (e) {
    if (!splitter.classList.contains("is-dragging")) return;
    var w = dragStartW + (e.clientX - dragStartX);
    sidebarEl.style.width = Math.min(SIDE_MAX, Math.max(SIDE_MIN, w)) + "px";
  });
  function endSplit() {
    if (!splitter.classList.contains("is-dragging")) return;
    splitter.classList.remove("is-dragging");
    document.body.style.cursor = "";
    document.body.style.userSelect = "";
    try { localStorage.setItem("zd-wb-split", sidebarEl.style.width); } catch (e2) {}
  }
  splitter.addEventListener("pointerup", endSplit);
  splitter.addEventListener("pointercancel", endSplit);
  try {
    var savedSplit = localStorage.getItem("zd-wb-split");
    if (savedSplit && splitActive()) sidebarEl.style.width = savedSplit;
  } catch (e3) {}

  /* ---------- 移动端切换 ---------- */
  var consolePane = document.querySelector(".sidebar");
  var docPane = document.querySelector(".doc-pane");
  function isMobile() { return window.matchMedia("(max-width: 760px)").matches; }
  function setPane(name) {
    document.querySelectorAll(".mode-tab").forEach(function (t) { t.classList.toggle("is-on", t.dataset.pane === name); });
    consolePane.classList.toggle("is-on", name === "console");
    docPane.classList.toggle("is-on", name === "doc");
    try { localStorage.setItem("zd-wb-pane", name); } catch (e) {}
  }
  document.querySelectorAll(".mode-tab").forEach(function (t) {
    t.addEventListener("click", function () { setPane(t.dataset.pane); });
  });
  if (isMobile()) {
    var savedPane = "doc";
    try { savedPane = localStorage.getItem("zd-wb-pane") || "doc"; } catch (e) {}
    setPane(savedPane);
  } else {
    consolePane.classList.add("is-on");
    docPane.classList.add("is-on");
  }
  window.addEventListener("resize", function () {
    if (!isMobile()) { consolePane.classList.add("is-on"); docPane.classList.add("is-on"); }
  });

  /* ---------- Toast ---------- */
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("is-show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { toast.classList.remove("is-show"); }, 2000);
  }

  /* ---------- 发布 ---------- */
  $("publish-btn").addEventListener("click", function () {
    var b = $("publish-btn");
    if (b.classList.contains("is-done")) return;
    setBusy(true);
    b.style.pointerEvents = "none";
    b.style.opacity = ".6";
    setTimeout(function () {
      setBusy(false);
      b.style.pointerEvents = "";
      b.style.opacity = "";
      b.classList.add("is-done");
      b.innerHTML = OK_ICON + "已发布";
      showToast("文章已发布");
      try { localStorage.setItem("zd-published-count", "3"); } catch (e) {}
    }, 1200);
  });

  /* ---------- 恢复草稿与日志 ---------- */
  function qs(name) {
    return new RegExp("[?&]" + name + "=([^&]*)").exec(location.search) ?
      decodeURIComponent(RegExp.$1) : null;
  }
  var DRAFT_PRESETS = {
    "draft-wb": {
      title: "一人公司生存指南:独立开发者的工具栈",
      content: "一个人活成一家公司,最关键的不是「什么都会」,而是「知道哪些该自己扛、哪些该外包」。我的工具栈分成三层:沟通、交付、现金流。沟通层用即时通讯加一份共享清单,交付层靠自动化脚本把重复劳动降到最低,现金流则是每个月雷打不动的订阅核销。没有哪一层需要最新最贵的工具,只要每一层都稳定运转。"
    },
    "draft-podcast": {
      title: "通勤路上听什么:我的播客私藏清单",
      content: "上班通勤的这四十分钟,以前是刷手机打发,现在是雷打不动的听播客时间。坚持了快两年,我的「下饭节目」换过几轮,但下面这六档,是无论如何都舍不得删的。"
    },
    "draft-prompt": {
      title: "",
      content: "提示词这个东西,与其说是在「跟模型对话」,不如说是在「跟自己对话」——你描述得越具体,得到的结果越接近你真正想要的东西。"
    }
  };
  var draftId = qs("draft");
  var editMode = qs("edit") === "1";
  if (draftId && DRAFT_PRESETS[draftId]) {
    var preset = DRAFT_PRESETS[draftId];
    titleInput.value = preset.title;
    contentInput.value = preset.content;
    pushSys("⟠ 已载入草稿「" + (preset.title || "无标题") + "」");
    try {
      localStorage.setItem("zd-draft-title", preset.title);
      localStorage.setItem("zd-draft-content", preset.content);
    } catch (e) {}
  }
  try {
    var st = localStorage.getItem("zd-console-log");
    if (st) {
      messages = JSON.parse(st);
      if (messages && messages.length) {
        render();
      } else {
        messages = [];
        pushSys("⟠ 已载入草稿「" + titleInput.value + "」 · " + countWords(contentInput.value) + " 字");
        pushSys("输入指令或点击下方 /命令,AI 会把修改直接写入右侧文档");
      }
    } else if (!draftId) {
      pushSys("⟠ 已载入草稿「" + titleInput.value + "」 · " + countWords(contentInput.value) + " 字");
      pushSys("输入指令或点击下方 /命令,AI 会把修改直接写入右侧文档");
    }
    var sp = localStorage.getItem("zd-wb-step");
    if (sp) { var s = JSON.parse(sp); P1_STEP = s.p1 || 0; CONT_STEP = s.ct || 0; TI_STEP = s.ti || 0; }
    if (!draftId) {
      var savedTitle = localStorage.getItem("zd-draft-title");
      var savedContent = localStorage.getItem("zd-draft-content");
      if (savedTitle) titleInput.value = savedTitle;
      if (savedContent) contentInput.value = savedContent;
    }
    if (editMode) showToast("已进入编辑模式,保存后将覆盖原稿");
    refreshCount();
  } catch (e) {
    pushSys("⟠ 已载入草稿「" + titleInput.value + "」 · " + countWords(contentInput.value) + " 字");
  }

  /* ---------- ⌘K 聚焦搜索 ---------- */
  document.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
      e.preventDefault();
      var s = $("search-input");
      if (s) s.focus();
    }
  });

  /* 通知浮窗 */
  var bellBtn = document.getElementById("bell-btn");
  var notifPop = document.getElementById("notif-pop");
  function setNotif(open) {
    if (!bellBtn || !notifPop) return;
    bellBtn.classList.toggle("is-open", open);
    notifPop.classList.toggle("is-open", open);
    bellBtn.setAttribute("aria-expanded", open ? "true" : "false");
  }
  if (bellBtn && notifPop) {
    bellBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      setNotif(bellBtn.getAttribute("aria-expanded") !== "true");
    });
    document.addEventListener("click", function (e) {
      if (bellBtn.getAttribute("aria-expanded") === "true" && !e.target.closest(".notif-wrap")) {
        setNotif(false);
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") setNotif(false);
    });
  }
  var readAll = document.getElementById("notif-readall");
  if (readAll) {
    readAll.addEventListener("click", function () {
      var dot = document.getElementById("bell-dot");
      if (dot) dot.style.display = "none";
      Array.prototype.slice.call(document.querySelectorAll(".notif-item.is-unread")).forEach(function (item) {
        item.classList.remove("is-unread");
      });
      bellBtn.setAttribute("aria-label", "通知");
    });
  }
})();
</script>
</body>
</html>
